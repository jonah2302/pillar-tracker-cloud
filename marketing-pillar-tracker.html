/* ---------------- csv ---------------- */
function csvCell(v){v=(v==null?"":String(v));return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function groupOf(r){
  var p=pillarById[r.pillar];
  if(!p||!p.split)return "";
  var g=p.split.filter(function(x){return inGroup(r,x);})[0];
  return g?g.label:"";
}
function exportCsv(){
  var list=base(), p=curPillar(), s=activeSnap();
  var head=["Pillar","Group","Inside pillar","Name","What it was about","Status","Start","End",
    "Community targeted","Feedback","Age range","Gender","Leads by age","Spend by age","Who it reached","Areas",
    "Budget","Spent","Leads","Cost per lead","Clients","Lead to client %","Cost per client","Who closed","Notes"];
  if(s)head=head.concat(["Snapshot spent","Snapshot leads","Snapshot clients","Spend change","Lead change","Client change"]);
  var lines=[head.map(csvCell).join(",")];
  list.forEach(function(r){
    var c=cpl(r), cv=convOf(r), pc=cpc(r);
    var cells=[(pillarById[r.pillar]||{}).label||r.pillar,groupOf(r),segLabel[r.pillar+":"+r.segment]||"",r.name,r.about,
      (STATUS[normStatus(r.status)]||{}).label||"",r.start,r.end,r.community,r.feedback,r.ageRange,r.gender,
      r.leadAges,r.ageSpend,r.audience,r.areas,
      n(r.budget).toFixed(2),n(r.spent).toFixed(2),n(r.leads),c==null?"":c.toFixed(2),
      n(r.clients),cv==null?"":cv.toFixed(1),pc==null?"":pc.toFixed(2),r.clientNotes,r.notes];
    if(s){
      var pr=prevRow(r);
      cells=cells.concat(pr?[n(pr.spent).toFixed(2),n(pr.leads),n(pr.clients),
        (n(r.spent)-n(pr.spent)).toFixed(2),n(r.leads)-n(pr.leads),n(r.clients)-n(pr.clients)]:["","","","","",""]);
    }
    lines.push(cells.map(csvCell).join(","));
  });
  lines.push("");
  lines.push(["SUBTOTALS"].map(csvCell).join(","));
  lanes().forEach(function(l){
    var sub=list.filter(function(r){return r.pillar===l.pillar&&inGroup(r,l.group);});
    if(!sub.length)return;
    var st=totals(sub), pad=[];
    for(var i=0;i<14;i++)pad.push("");
    lines.push([(pillarById[l.pillar]||{}).label,l.label].concat(pad).concat([
      st.budget.toFixed(2),st.spent.toFixed(2),st.leads,st.cpl==null?"":st.cpl.toFixed(2),
      st.clients,st.conv==null?"":st.conv.toFixed(1),st.cpc==null?"":st.cpc.toFixed(2),"",""]).map(csvCell).join(","));
  });
  var csv=lines.join("\r\n");
  var name="marketing-"+(p?p.id:"all-pillars")+"-"+new Date().toISOString().slice(0,10)+".csv";
  if(downloadsRef){
    downloadsRef.save({filename:name,data:csv}).catch(function(e){
      if(e&&e.code==="declined")return;
      notify("The export did not go through"+(e&&e.message?": "+e.message:"."));
    });
  } else {
    notify("Saving files is not available in this view. Open the tracker in the Claude app to export a CSV.");
  }
}

/* ---------------- Sierra sheets, as real PDF files ----------------
   Every Sierra section exports the same way: one realtor, or all of them in one
   file. Each section builds a plain description of its sheet — masthead, three
   figures, blocks of tables — and sxPdfDoc draws it with jsPDF, so what comes
   out is a .pdf with selectable text and working Sierra links, not a web page.
   Typefaces are the PDF standard set (Times and Helvetica): Marcellus and
   IBM Plex Sans would each have to be embedded as a font file inside the page,
   and the viewer cannot fetch one. So these sheets match the tracker on size
   and contrast rather than on typeface. */
var SX_DAY=1440;
function slugName(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")||"realtor";}
function sxAvg(a){return a.length?a.reduce(function(p,q){return p+q;},0)/a.length:null;}
function sxReplies(x){var s=x.s;return n(s.calls&&s.calls.in)+n(s.texts&&s.texts.in)+n(s.emails&&s.emails.in);}
function sxSource(x){return x.other?x.camp:"Meta · "+x.camp;}
function sxSignedUp(x){return x.time?sxWhen(x.time):shortDate(x.date);}
function sxOnly(list,who){return who?list.filter(function(x){return ncAgentName(x)===who;}):list;}
function sxLink(x){return (x.s&&x.s.sid)?(SIERRA_LEAD_URL+x.s.sid):"";}
function sxRangeLabel(b){
  var to=b.to>todayYmd()?todayYmd():b.to;
  return shortDate(b.from)+" – "+shortDate(to)+", "+String(to).slice(0,4);
}
function sxCheckedAt(){
  return new Date(SIERRA.pulledAt).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
}
function sxMadeOn(){return new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});}
function sxLines(who,b,extra){
  return [sxRangeLabel(b),who?who+" only":"All realtors",extra||"",
    "Follow-up checked "+sxCheckedAt(),"Made "+sxMadeOn()].filter(Boolean);
}
/* a cell: plain text, or {t:text, link:url, tone:"late"|"ok"|"name"|"soft", bar:0..1} */
function cell(t,o){o=o||{};o.t=(t==null?"":String(t));return o;}

/* ---- the waiting-lead table, shared by the waiting sheets ---- */
function sxWaitBlock(title,key,list,scale){
  var w=list.map(sxWaitMin), rep=0;
  list.forEach(function(x){rep+=sxReplies(x);});
  return {title:title,key:key,
    head:["Lead","Where it came from","Signed up","","Waiting","Replies"],
    align:["left","left","left","left","right","right"],
    cols:{0:{cellWidth:96},2:{cellWidth:74},3:{cellWidth:62},4:{cellWidth:48},5:{cellWidth:40}},
    rows:list.map(function(x){
      var m=sxWaitMin(x), late=m>SX_DAY;
      return [cell(x.name,{tone:"name",link:sxLink(x)}),cell(sxSource(x),{tone:"soft"}),
        cell(sxSignedUp(x)),cell("",{bar:Math.max(0.04,m/scale),late:late}),
        cell(sxDur(m),{tone:late?"late":""}),cell(sxReplies(x)||"—")];
    }),
    foot:[cell(list.length+" waiting · longest "+sxDur(Math.max.apply(null,w))+" · avg "+sxDur(sxAvg(w)),{span:4}),
      cell(""),cell(rep||"0")]};
}
/* ---- lead-by-lead detail, shared by the by-realtor sheets ---- */
function sxLeadBlock(title,key,list){
  return {title:title,key:key,
    head:["Lead","Where it came from","Signed up","Calls","Texts","Emails","First contact","Last contact"],
    align:["left","left","left","right","right","right","left","left"],
    cols:{0:{cellWidth:92},2:{cellWidth:68},3:{cellWidth:30},4:{cellWidth:30},5:{cellWidth:33},
      6:{cellWidth:62},7:{cellWidth:68}},
    rows:list.map(function(x){
      var s=x.s, ok=s.status==="ok";
      var first=!ok?"—":(x.reached?(x.firstMin!=null?"after "+sxDur(x.firstMin):sxWhen(s.first)):"Not yet");
      return [cell(x.name,{tone:"name",link:sxLink(x)}),cell(sxSource(x),{tone:"soft"}),
        cell(sxSignedUp(x)),cell(ok?n(s.calls.out):"—"),cell(ok?n(s.texts.out):"—"),
        cell(ok?n(s.emails.out):"—"),cell(first,{tone:(ok&&!x.reached)?"late":""}),
        cell(ok&&s.last?sxWhen(s.last):"—")];
    })};
}

/* ---- 1. not contacted yet ---- */
function pdfWaiting(who){
  var b=sxNcBounds(), all=sxNotContacted(), list=sxOnly(all,who);
  if(!list.length)return null;
  var inRange=sierraLeads(b.from,b.to).concat(sierraOther(b.from,b.to));
  var mine=sxOnly(inRange,who);
  var scale=Math.max.apply(null,[1].concat(list.map(sxWaitMin)));
  var over=list.filter(function(x){return sxWaitMin(x)>SX_DAY;}).length;
  var longest=list.slice().sort(function(a,c){return sxWaitMin(c)-sxWaitMin(a);})[0];
  var ignored=list.filter(function(x){return sxReplies(x)>0;});
  var unassigned=list.filter(function(x){return !x.agent;}).length;
  var blocks=[];

  if(who){
    var reached=mine.filter(function(x){return x.reached;});
    var myAvg=sxAvg(mine.filter(function(x){return x.firstMin!=null;}).map(function(x){return x.firstMin;}));
    var teamAvg=sxAvg(inRange.filter(function(x){return x.firstMin!=null;}).map(function(x){return x.firstMin;}));
    blocks.push(sxWaitBlock("Call these "+list.length,"longest waiting first",list,scale));
    if(ignored.length)blocks.push({flag:ignored.map(function(x){return x.name;}).join(", ")+
      (ignored.length===1?" has":" have")+" written back and "+(ignored.length===1?"is":"are")+
      " still waiting for a first reply from you."});
    blocks.push({title:"Sierra links",key:"the lead names above are clickable too",
      head:["Lead","Open in Sierra"],align:["left","left"],cols:{0:{cellWidth:120}},
      rows:list.map(function(x){
        return [cell(x.name,{tone:"name"}),
          cell(sxLink(x)?sxLink(x).replace("https://",""):"—",{tone:"soft",link:sxLink(x)})];
      })});
    return {file:"not-contacted",title:who+" — not contacted yet",
      name:who+" · not contacted yet",lines:sxLines(who,b),
      verdict:{mark:"bad",text:list.length+" of your "+mine.length+" new leads have had no contact at all"},
      heroes:[{cap:"Waiting on you",big:String(list.length),sub:"of "+mine.length+" new leads",tone:"bad"},
        {cap:"Longest wait",big:sxDur(sxWaitMin(longest)),sub:longest.name},
        {cap:"Your avg first contact",big:sxDur(myAvg),
         sub:"on the "+reached.length+" you did reach · team "+sxDur(teamAvg)}],
      blocks:blocks,
      foot:"Waiting time is measured to the last Sierra check, "+sxCheckedAt()+
        ". Sierra's automatic emails and texts are not counted as contact."};
  }

  var groups=sxNcAgents(list).map(function(a){
    return {name:a.name,leads:list.filter(function(x){return ncAgentName(x)===a.name;})};
  });
  groups.forEach(function(g,i){
    blocks.push(sxWaitBlock(g.name,i===0?"bar length is how long they have waited":
      (g.name==="No agent assigned"?"nobody owns these in Sierra":""),g.leads,scale));
  });
  var flag=longest.name+" has been waiting "+sxDur(sxWaitMin(longest))+
    (sxReplies(longest)?" and has already replied "+sxReplies(longest)+" time"+(sxReplies(longest)===1?"":"s")+".":".");
  if(ignored.length)flag+=" "+ignored.length+" lead"+(ignored.length===1?" has":"s have")+
    " written back and still have had no answer from anyone.";
  if(unassigned)flag+=" "+unassigned+" lead"+(unassigned===1?" has":"s have")+
    " nobody assigned in Sierra, so no one is on the hook for them.";
  blocks.push({flag:flag});
  blocks.push({title:"Leads waiting, by realtor",key:"",newPage:true,
    head:["Realtor","Waiting","Over a day","Longest","Average","Replies ignored"],
    align:["left","right","right","right","right","right"],
    cols:{0:{cellWidth:150}},
    rows:groups.map(function(g){
      var w=g.leads.map(sxWaitMin), lt=w.filter(function(v){return v>SX_DAY;}).length;
      return [cell(g.name,{tone:"name"}),cell(g.leads.length),cell(lt,{tone:lt?"late":""}),
        cell(sxDur(Math.max.apply(null,w))),cell(sxDur(sxAvg(w))),
        cell(g.leads.filter(function(x){return sxReplies(x)>0;}).length)];
    }),
    foot:[cell("Total"),cell(list.length),cell(over),cell(sxDur(scale)),
      cell(sxDur(sxAvg(list.map(sxWaitMin)))),cell(ignored.length)],
    note:"Replies ignored counts leads who called, texted or emailed back and still have had no answer from anyone."});

  return {file:"not-contacted",title:"Not contacted yet",name:"Not contacted yet",lines:sxLines("",b),
    verdict:{mark:"bad",text:list.length+" leads waiting, "+over+" of them more than a day"},
    heroes:[{cap:"Leads waiting",big:String(list.length),sub:"of "+inRange.length+" that came in",tone:"bad"},
      {cap:"Waiting over a day",big:String(over),sub:"no call, text or email"},
      {cap:"Longest wait",big:sxDur(sxWaitMin(longest)),sub:longest.name}],
    blocks:blocks,
    foot:"Waiting time is measured to the last Sierra check, "+sxCheckedAt()+
      ". Sierra's automatic emails and texts are not counted as contact."};
}

/* ---- 2. Meta ad leads, by realtor ---- */

  var avgF=sxAvg(list.filter(function(x){return x.firstMin!=null;}).map(function(x){return x.firstMin;}));
  var agents=sxAgg(list), blocks=[];

  blocks.push({title:who?"What was done":"What each realtor did",
    key:"only what a person did — Sierra's automatic messages left out",
    head:["Realtor","Leads","Reached","Not","Calls","Talk","Texts","Emails","Replies","Avg first","Deals"],
    align:["left","right","right","right","right","right","right","right","right","right","right"],
    cols:{0:{cellWidth:94},5:{cellWidth:46},9:{cellWidth:48}},
    rows:agents.map(function(a){
      var nr=a.leads.length-a.reached, side=/^(Not in|Check|Not checked)/.test(a.name);
      if(side)return [cell(a.name,{tone:"name"}),cell(a.leads.length),

      return [cell(a.name,{tone:"name"}),cell(a.leads.length),cell(a.reached,{tone:"ok"}),

        rows:ranked.map(function(a){
          return [cell(a.name,{tone:"name"}),cell("",{bar:Math.max(0.04,a.avgFirst/mx),late:a.avgFirst>SX_DAY}),
            cell(sxDur(a.avgFirst),{tone:a.avgFirst>SX_DAY?"late":""})];
        }),
        note:"Team average "+sxDur(avgF)+". Leads nobody has reached are left out of these averages and listed on the Not contacted yet sheet instead."});
    }
  }
  return {file:"meta-leads",title:(who?who+" — Meta ad leads":"Meta ad leads, by realtor"),
    name:who?who+" · Meta ad leads":"Meta ad leads, by realtor",
    lines:sxLines(who,b,list.length+" Meta lead"+(list.length===1?"":"s")),
    verdict:{mark:reached.length>=ok.length*0.8?"good":"flat",
      text:reached.length+" of "+list.length+" Meta leads were reached, first contact averaging "+sxDur(avgF)},
    heroes:[{cap:"Reached",big:String(reached.length),
        sub:ok.length?pct1(reached.length/ok.length*100)+" of those in Sierra":"—",tone:"good"},
      {cap:"Not reached",big:String(ok.length-reached.length),sub:"no call, text or email",
        tone:(ok.length-reached.length)?"bad":""},
      {cap:"Avg first contact",big:sxDur(avgF),sub:"form sent → first touch"}],
    blocks:blocks,
    foot:"Counts are calls, texts and emails made by a person in Sierra. Replies are what came back from the lead."};

/* ---- 4. every lead ---- */
function pdfEveryLead(who){

/* ---- 5. whole team, all leads ---- */
function pdfTeam(who){
  var A=sxTeamAgg(), list=who?A.list.filter(function(a){return a.name===who;}):A.list;
  if(!list.length)return null;
  var tot={calls:0,talk:0,leads:{},newLeads:0,notViewed:0,noCalls:0,sessions:0,fc:[]};
  list.forEach(function(a){
    tot.calls+=a.calls; tot.talk+=a.talk; tot.newLeads+=a.newLeads;
    tot.notViewed+=a.notViewed; tot.noCalls+=a.noCalls; tot.sessions+=a.sessions;
    Object.keys(a.leads).forEach(function(s){tot.leads[s]=1;});
    a.fc.forEach(function(v){tot.fc.push(v);});
  });
  var nDays=A.nDays, called=Object.keys(tot.leads).length;
  var perDay=Math.round(tot.calls/nDays*10)/10;
  return {file:"whole-team",title:(who?who+" — all leads":"Whole team, all leads"),

/* ---------------- drawing the PDF ---------------- */
var SX_C={ink:[20,25,26],ink2:[57,68,70],muted:[65,75,73],faint:[94,104,102],
  line:[201,208,206],hair:[227,231,229],well:[239,241,240],brass:[142,112,53],
  good:[53,97,74],goodWash:[230,239,233],bad:[164,80,58],badWash:[246,231,226]};
var SX_M=40, SX_PW=612, SX_PH=792, SX_BOT=56;
function sxPdfDoc(spec){
  var J=(typeof window!=="undefined"&&window.jspdf)?window.jspdf.jsPDF:null;
  if(!J)return null;
  var doc=new J({unit:"pt",format:"letter",orientation:"portrait",compress:true});
  if(typeof doc.autoTable!=="function")return null;
  var W=SX_PW-SX_M*2, y=SX_M+6;

  function set(font,style,size,col){
    doc.setFont(font,style); doc.setFontSize(size);
    doc.setTextColor(col[0],col[1],col[2]);
  }
  function rule(yy,wt,col){
    doc.setDrawColor(col[0],col[1],col[2]); doc.setLineWidth(wt);
    doc.line(SX_M,yy,SX_M+W,yy);
  }
  function room(need){
    if(y+need>SX_PH-SX_BOT){doc.addPage();y=SX_M+6;return true;}
    return false;
  }

  /* masthead */
  set("times","bold",10,SX_C.ink);
  doc.setCharSpace(1.6); doc.text("SIERRA FOLLOW-UP",SX_M,y); doc.setCharSpace(0);
  set("helvetica","normal",8.2,SX_C.muted);
  var ly=y-2;
  spec.lines.forEach(function(l,i){
    if(i===0){set("helvetica","bold",8.6,SX_C.ink);} else {set("helvetica","normal",8.2,SX_C.muted);}
    doc.text(String(l),SX_M+W,ly,{align:"right"}); ly+=10.5;
  });
  y+=16;
  set("times","normal",19,SX_C.ink);
  doc.splitTextToSize(spec.name,W*0.62).forEach(function(l){doc.text(l,SX_M,y);y+=21;});
  y=Math.max(y,ly)+4;
  rule(y,1.4,SX_C.ink); y+=20;

  /* verdict */
  if(spec.verdict){
    var m=spec.verdict.mark;
    var fill=m==="bad"?SX_C.badWash:(m==="good"?SX_C.goodWash:SX_C.well);
    var ic=m==="bad"?SX_C.bad:(m==="good"?SX_C.good:SX_C.muted);
    doc.setFillColor(fill[0],fill[1],fill[2]);
    doc.circle(SX_M+13,y+7,13,"F");
    set("times","bold",14,ic);
    doc.text(m==="bad"?"!":(m==="good"?"+":"="),SX_M+13,y+12,{align:"center"});
    set("times","normal",17,SX_C.ink);
    var vy=y+2;
    doc.splitTextToSize(spec.verdict.text,W-40).forEach(function(l){vy+=12;doc.text(l,SX_M+34,vy);});
    y=Math.max(y+30,vy+12);
  }

  /* three figures */
  if(spec.heroes&&spec.heroes.length){
    var bw=W/spec.heroes.length, bh=58;
    spec.heroes.forEach(function(h,i){
      var x=SX_M+i*bw;
      if(h.tone==="bad"){doc.setFillColor(SX_C.badWash[0],SX_C.badWash[1],SX_C.badWash[2]);doc.rect(x,y,bw,bh,"F");}
      else if(h.tone==="good"){doc.setFillColor(SX_C.goodWash[0],SX_C.goodWash[1],SX_C.goodWash[2]);doc.rect(x,y,bw,bh,"F");}
      set("helvetica","bold",7.8,SX_C.ink2);
      doc.text(String(h.cap).toUpperCase(),x+bw/2,y+14,{align:"center"});
      set("times","normal",21,h.tone==="bad"?SX_C.bad:(h.tone==="good"?SX_C.good:SX_C.ink));
      doc.text(String(h.big),x+bw/2,y+36,{align:"center"});
      set("helvetica","normal",7.4,SX_C.faint);
      doc.text(doc.splitTextToSize(String(h.sub),bw-10)[0]||"",x+bw/2,y+48,{align:"center"});
      if(i)  {doc.setDrawColor(SX_C.hair[0],SX_C.hair[1],SX_C.hair[2]);doc.setLineWidth(.5);
              doc.line(x,y,x,y+bh);}
    });
    doc.setDrawColor(SX_C.line[0],SX_C.line[1],SX_C.line[2]); doc.setLineWidth(.6);
    doc.rect(SX_M,y,W,bh);
    y+=bh+22;
  }

  /* blocks */
  (spec.blocks||[]).forEach(function(blk){
    if(blk.flag){
      var txt=doc.splitTextToSize(blk.flag,W-26);
      room(txt.length*10+20);
      var bh2=txt.length*10+16;
      doc.setFillColor(SX_C.badWash[0],SX_C.badWash[1],SX_C.badWash[2]);
      doc.rect(SX_M,y,W,bh2,"F");
      doc.setFillColor(SX_C.bad[0],SX_C.bad[1],SX_C.bad[2]); doc.rect(SX_M,y,2,bh2,"F");
      set("helvetica","normal",8.8,SX_C.ink2);
      var fy=y+12; txt.forEach(function(l){doc.text(l,SX_M+12,fy);fy+=10;});
      y+=bh2+18;
      return;
    }
    if(blk.newPage){doc.addPage();y=SX_M+6;}
    else room(70);
    /* block head */
    set("times","normal",12.5,SX_C.ink);
    doc.text(blk.title,SX_M,y);
    if(blk.key){
      set("helvetica","normal",7.6,SX_C.muted);
      doc.text(blk.key,SX_M+W,y,{align:"right"});
    }
    y+=5; rule(y,.6,SX_C.line); y+=8;

    var head=blk.head.map(function(t,i){
      return {content:String(t).toUpperCase(),
        styles:{halign:(blk.align&&blk.align[i])||"left"}};
    });
    var body=blk.rows.map(function(r){
      return r.map(function(c,i){
        var st={halign:(blk.align&&blk.align[i])||"left"};
        if(c.tone==="name"){st.textColor=c.link?SX_C.brass:SX_C.ink;st.fontStyle="bold";}
        if(c.tone==="soft")st.textColor=SX_C.muted;
        if(c.tone==="late"){st.textColor=SX_C.bad;st.fontStyle="bold";}
        if(c.tone==="ok"){st.textColor=SX_C.good;st.fontStyle="bold";}
        var out={content:c.t,styles:st,_c:c};
        if(c.span)out.colSpan=c.span;   /* colSpan belongs on the cell, not in styles */
        return out;
      });
    });
    var foot=blk.foot?[blk.foot.map(function(c,i){
      var st={halign:(blk.align&&blk.align[i])||"left"};
      var out={content:c.t,styles:st};
      if(c.span)out.colSpan=c.span;
      return out;
    })]:undefined;

    doc.autoTable({
      startY:y, margin:{left:SX_M,right:SX_M,bottom:SX_BOT}, theme:"plain",
      head:[head], body:body, foot:foot,
      styles:{font:"helvetica",fontSize:8.2,cellPadding:{top:4.5,right:6,bottom:4.5,left:0},
        textColor:SX_C.ink2,lineWidth:0,overflow:"linebreak",valign:"middle"},
      headStyles:{font:"helvetica",fontStyle:"bold",fontSize:7.3,textColor:SX_C.faint,
        cellPadding:{top:0,right:6,bottom:4,left:0}},
      footStyles:{font:"helvetica",fontStyle:"bold",fontSize:8.2,textColor:SX_C.ink,
        cellPadding:{top:6,right:6,bottom:0,left:0}},
      columnStyles:blk.cols||{},
      didDrawCell:function(d){
        var c=d.cell.raw&&d.cell.raw._c;
        /* row rules, drawn once per row */
        if(d.column.index===d.table.columns.length-1){
          var lw=d.section==="head"?.7:(d.section==="foot"?0:.4);
          if(lw){
            doc.setDrawColor.apply(doc,d.section==="head"?SX_C.line:SX_C.hair);
            doc.setLineWidth(lw);
            doc.line(SX_M,d.cell.y+d.cell.height,SX_M+W,d.cell.y+d.cell.height);
          }
          if(d.section==="foot"){
            doc.setDrawColor.apply(doc,SX_C.line); doc.setLineWidth(.7);
            doc.line(SX_M,d.cell.y,SX_M+W,d.cell.y);
          }
        }
        if(d.section!=="body"||!c)return;
        if(c.bar!=null){
          var bx=d.cell.x, by=d.cell.y+d.cell.height/2-4.5, bwid=d.cell.width-8;
          doc.setFillColor(SX_C.well[0],SX_C.well[1],SX_C.well[2]);
          doc.rect(bx,by,bwid,9,"F");
          var col=c.late?SX_C.bad:SX_C.brass;
          doc.setFillColor(col[0],col[1],col[2]);
          doc.rect(bx,by,Math.max(2,bwid*Math.min(1,c.bar)),9,"F");
        }
        if(c.link){
          doc.link(d.cell.x,d.cell.y,d.cell.width,d.cell.height,{url:c.link});
        }
      }
    });
    y=doc.lastAutoTable.finalY+(blk.note?8:20);
    if(blk.note){
      var nt=doc.splitTextToSize(blk.note,W-24);
      room(nt.length*9+16);
      doc.setFillColor(SX_C.well[0],SX_C.well[1],SX_C.well[2]);
      doc.rect(SX_M,y,W,nt.length*9+12,"F");
      set("helvetica","normal",8,SX_C.muted);
      var ny=y+10; nt.forEach(function(l){doc.text(l,SX_M+10,ny);ny+=9;});
      y+=nt.length*9+12+20;
    }
  });

  /* footer on every page */
  var pages=doc.getNumberOfPages();
  for(var p=1;p<=pages;p++){
    doc.setPage(p);
    var fy2=SX_PH-SX_M+4;
    doc.setDrawColor(SX_C.hair[0],SX_C.hair[1],SX_C.hair[2]); doc.setLineWidth(.5);
    doc.line(SX_M,fy2-12,SX_M+W,fy2-12);
    set("helvetica","bold",7.4,SX_C.faint);
    doc.setCharSpace(.8);
    doc.text("MARKETING PILLAR TRACKER · SIERRA",SX_M,fy2-3);
    doc.setCharSpace(0);
    set("helvetica","normal",7.4,SX_C.faint);
    doc.text("Page "+p+" of "+pages,SX_M+W,fy2-3,{align:"right"});
    if(p===pages&&spec.foot){
      var ft=doc.splitTextToSize(spec.foot,W);
      var ty=fy2-20-(ft.length-1)*8;
      ft.forEach(function(l){doc.text(l,SX_M,ty);ty+=8;});
    }
  }
  return doc;
}

/* ---------------- the cloud feed ---------------- */
/* AES-256-GCM, key stretched with PBKDF2 - the same shape make-live.js writes.
   The address is public so that the job publishing to it can be free; what sits
   there is ciphertext, and the key travels with the page. */
function liveBytes(b64){
  var r=atob(b64),a=new Uint8Array(r.length);
  for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);
  return a;
}
function liveFetch(manual){
  if(!LIVE||!LIVE.url||!LIVE.key||LIVE_BUSY)return Promise.resolve(false);
  if(!(window.crypto&&window.crypto.subtle)){LIVE_ERR="this browser cannot decrypt the feed";return Promise.resolve(false);}
  LIVE_BUSY=true;
  var u=LIVE.url+(LIVE.url.indexOf("?")<0?"?":"&")+"t="+Date.now();
  return fetch(u,{cache:"no-store"})
    .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
    .then(function(j){
      var enc=new TextEncoder().encode(LIVE.key);
      return crypto.subtle.importKey("raw",enc,"PBKDF2",false,["deriveKey"])
        .then(function(k){return crypto.subtle.deriveKey(
          {name:"PBKDF2",salt:liveBytes(j.salt),iterations:j.iter||200000,hash:"SHA-256"},
          k,{name:"AES-GCM",length:256},false,["decrypt"]);})
        .then(function(k){return crypto.subtle.decrypt({name:"AES-GCM",iv:liveBytes(j.iv)},k,liveBytes(j.data));})
        .then(function(buf){return {j:j,d:JSON.parse(new TextDecoder().decode(buf))};});
    })
    .then(function(o){
      var d=o.d;
      if(Array.isArray(d.rows)&&d.rows.length)liveRows=d.rows;
      if(Array.isArray(d.snaps)){liveSnaps=d.snaps;applySnaps();}
      if(d.days&&Object.keys(d.days).length)DAYS=d.days;
      if(d.sierra)SIERRA=d.sierra;
      if(Array.isArray(d.ads)){liveAds=d.ads;ADS=d.ads.filter(function(a){return a.running!==false;});}
      DATA_AT=d.updated||d.builtAt||o.j.builtAt||DATA_AT;
      LIVE_AT=new Date().toISOString(); LIVE_ERR="";
      applyRows(); ready=true; render();
      if(manual)notify("Fetched the current figures"+(DATA_AT?" - Meta last pulled "+
        new Date(DATA_AT).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):"")+".");
      return true;
    })
    .catch(function(e){
      var why=String((e&&e.message)||e);
      if(/operation|decrypt/i.test(why))why="this copy does not match the published figures";
      LIVE_ERR=why; render();
      if(manual)notify("The current figures could not be fetched ("+why+"). Nothing was lost - what is on screen is the last good read.");
      return false;
    })
    .then(function(ok){LIVE_BUSY=false;return ok;});
}
function liveStart(){
  if(!LIVE||!LIVE.url||!LIVE.key)return;
  if(LIVE_TIMER)clearInterval(LIVE_TIMER);
  var every=Math.max(60,n(LIVE.every)||300)*1000;   /* default: every five minutes */
  liveFetch(false);
  LIVE_TIMER=setInterval(function(){liveFetch(false);},every);
}
/* a tab left open all day catches up the moment it is looked at again */
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="visible"&&LIVE_AT&&Date.now()-Date.parse(LIVE_AT)>60000)liveFetch(false);
});

/* ---------------- boot ---------------- */
localLoad();

(function(){
  var C=window.claude;
  if(!C||!C.use){ready=true;render();return;}
  Promise.resolve(C.use("user")).then(function(user){
    return user?Promise.resolve(user.can("data.write")).catch(function(){return null;}):null;
  }).catch(function(){return null;}).then(function(w){
    canWrite=w;
    return Promise.resolve(C.use("downloads")).catch(function(){return null;});
  }).then(function(d){
    downloadsRef=d||null;
    return Promise.resolve(C.use("db")).catch(function(){return null;});
  }).then(function(db){
    if(!db){ready=true;render();return;}
    dbRef=db;
    /* where the feed is published, and the key to read it. Kept in the database
       rather than in the page, so pointing the tracker at a feed - or moving it
       - needs no new version of this file. */
    db.collection("config").doc("live").onSnapshot(function(doc){
      var d=(doc&&doc.data&&doc.data())||null;
      LIVE=(d&&d.url&&d.key)?d:null;
      if(LIVE)liveStart(); else if(LIVE_TIMER){clearInterval(LIVE_TIMER);LIVE_TIMER=null;}
      render();
    },function(){});
    db.collection("campaigns").onSnapshot(function(snap){
      /* never replace good figures with an empty read */
      if(!snap.docs.length&&dbRows.length){ready=true;render();return;}
      dbRows=snap.docs.map(function(doc){return Object.assign({id:doc.id},doc.data());});
      applyRows();
      ready=true;render();
    },function(err){
      ready=true;render();
      notify("Live sync stopped ("+((err&&err.code)||"unavailable")+"). Reload the page to reconnect.");
    });
    db.collection("snapshots").onSnapshot(function(snap){
      dbSnaps=snap.docs.map(function(doc){return Object.assign({id:doc.id},doc.data());});
      applySnaps();
      render();
    },function(){});
    /* Meta's day-by-day figures, one document per month, refreshed every morning */
    db.collection("daily").onSnapshot(function(snap){
      var all={};
      snap.docs.forEach(function(doc){var d=doc.data()||{};Object.keys(d.days||{}).forEach(function(k){all[k]=d.days[k];});
        if(d.pulledAt&&(!DATA_AT||d.pulledAt>DATA_AT))DATA_AT=d.pulledAt;});
      if(!liveRows)DAYS=all;   /* the feed, where there is one, is the fresher of the two */
      render();
    },function(){});
    /* the ads running right now: format, artwork and their own daily figures */
    db.collection("creatives").onSnapshot(function(snap){
      if(liveAds)return;       /* the feed already carries the ads */
      ADS=snap.docs.map(function(doc){return Object.assign({adId:doc.id},doc.data());})
        .filter(function(a){return a.running!==false;});
      render();
    },function(){});
    /* Sierra follow-up figures, refreshed every morning */
    db.collection("sierra").onSnapshot(function(snap){
      var d=snap.docs.filter(function(x){return x.id==="latest";})[0];
      if(d&&!liveRows){SIERRA=d.data()||null; render();}
    },function(){});
  }).catch(function(){ready=true;render();});
})();
</script>

</body></html>
