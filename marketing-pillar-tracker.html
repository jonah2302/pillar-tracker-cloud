<script>
/* ---------------- model ---------------- */
var EXTRA={
  community:{label:"Community we targeted",col:"Community",ph:"Which subdivision, farm or route the drop went to"},
  feedback:{label:"Feedback",col:"Feedback",ph:"Calls and texts it generated, what people said"}
};
var PILLARS=[
 {id:"meta",label:"Meta Ads",tab:"Meta Ads",item:"Campaign / ad set",about:"What the ad was about",
  blurb:"Pulled straight from Meta Ads Manager. Meta Only and SOI each have their own page — nothing crosses between the two.",
  segs:[{id:"soi",label:"SOI"},{id:"prospect",label:"Prospecting"}],
  split:[
    {key:"paid",label:"Meta Only",short:"Meta Only",mark:"Kept apart",
     note:"Prospecting campaigns — figures straight from Ads Manager.",segs:["prospect",""]},
    {key:"soi",label:"SOI Only",short:"SOI Only",mark:"Kept apart",noRates:true,
     note:"Warm audience built from your own contact list. Its spend and leads stand alone.",segs:["soi"]}
  ]},
 {id:"events",label:"Seminars & Events",tab:"Seminars / Events",item:"Event",about:"What the event was about",
  blurb:"Seminars, community events and open houses, with the cost of putting them on.",
  segs:[{id:"seminar",label:"Seminar"},{id:"event",label:"Community Event"},{id:"openhouse",label:"Open House"}]},
 {id:"bizdev",label:"Business Development",tab:"BD",item:"Initiative",about:"What the activity was",
  blurb:"Referral partners, builders and corporate relationships.",
  segs:[{id:"referral",label:"Referral Partners"},{id:"builder",label:"Builders"},{id:"corp",label:"Corporate"}]},
 {id:"mailers",label:"Mailers",tab:"Mailers",item:"Mailer / drop",about:"What the mailer was",
  blurb:"Print drops by community, with the feedback each one generated.",
  extra:["community","feedback"],
  segs:[{id:"justsold",label:"Just Sold"},{id:"justlisted",label:"Just Listed"},{id:"farm",label:"Farm / Neighborhood"},{id:"newsletter",label:"Newsletter"},{id:"invite",label:"Event Invite"}]},
 {id:"google",label:"Google Ads",tab:"Google Ads",item:"Campaign",about:"What the ad or page was about",planned:true,
  blurb:"Not started yet. Log here if you green-light Google ads or SEO work.",
  segs:[{id:"ads",label:"Google Ads"},{id:"lsa",label:"Local Services"},{id:"seo",label:"SEO / Google Business"}]}
];
var STATUS={live:{label:"Active",cls:"live"},paused:{label:"Paused",cls:"paused"}};
/* Only two states are tracked. Anything older (done, planned) folds into paused. */
function normStatus(v){return v==="live"?"live":"paused";}
var pillarById={},segLabel={};
PILLARS.forEach(function(p){pillarById[p.id]=p;p.segs.forEach(function(s){segLabel[p.id+":"+s.id]=s.label;});});

function lanes(){
  var out=[];
  PILLARS.forEach(function(p){
    if(p.split) p.split.forEach(function(g){out.push({key:p.id+":"+g.key,pillar:p.id,label:g.short,group:g});});
    else out.push({key:p.id,pillar:p.id,label:p.tab,group:null});
  });
  return out;
}
function inGroup(r,g){return !g?true:g.segs.indexOf(r.segment||"")>=0;}

var ADS=[]; /* the ads running right now, with their format and artwork (pull-creatives.js) */
var SIERRA=null; /* Sierra CRM figures (sierra-sync.js), refreshed every morning */
var DATA_AT=null; /* when the Meta figures were last pulled */
var rows=[], snaps=[], DAYS={}, ready=false, canWrite=null, dbRef=null, downloadsRef=null;
/* ---- the cloud feed ----
   Everything above arrives from this artifact's own database, which something
   has to write. The feed below is the other way in: a small encrypted file on a
   public address that a scheduled job rewrites every few minutes, with no
   laptop involved. Where LIVE is configured the page fetches it on open and
   again on a timer, so the figures are current however long ago the link was
   shared. The database is still read, and still wins on the one thing nobody
   else knows: the Deal / Qualified tags typed in by hand. */
var LIVE=null;          /* {url,key,every} - read from the database, never guessed */
var LIVE_AT=null;       /* when this page last fetched the feed */
var LIVE_ERR="";        /* why the last fetch failed, if it did */
var LIVE_BUSY=false, LIVE_TIMER=null;
var dbRows=[], dbSnaps=[], liveRows=null, liveSnaps=null, liveAds=null;
var view={tab:"meta",metaSub:"paid",openLeads:{},ncAgent:"",sxPick:{},seg:{},format:"",adOpen:"",status:"all",period:"thisweek",pFrom:"",pTo:"",q:"",sort:"start",dir:-1,compare:"",cFrom:"",cTo:""};
var editing=null, pendingDelete=false;

/* Saved weeks: the database first, because that is where a week saved by hand
   goes, and the feed fills any week the database has not got. A week missing
   here is not a cosmetic gap - "All time" is measured from the first saved week
   to the last, so a missing week quietly shrinks every all-time figure. */
function applySnaps(){
  var out=dbSnaps.slice(), have={}, start={};
  out.forEach(function(x){have[x.id]=1;if(x.periodStart)start[x.periodStart]=1;});
  (liveSnaps||[]).forEach(function(x){
    if(have[x.id]||(x.periodStart&&start[x.periodStart]))return;
    out.push(x);
  });
  snaps=out.sort(function(a,b){return String(b.takenAt||"").localeCompare(String(a.takenAt||""));});
}

/* The feed carries Meta's figures; the database carries the tags. Merge rather
   than choose, so a figure is never stale and a tag is never lost. */
function applyRows(){
  if(!liveRows){rows=dbRows;return;}
  var q={};
  dbRows.forEach(function(r){
    (Array.isArray(r.leadRecords)?r.leadRecords:[]).forEach(function(l){
      if(l&&l.id&&l.quality!==undefined&&l.quality!=="")q[r.id+"|"+l.id]=l.quality;
    });
  });
  rows=liveRows.map(function(r){
    var recs=(Array.isArray(r.leadRecords)?r.leadRecords:[]).map(function(l){
      var k=q[r.id+"|"+l.id];
      return k===undefined?l:Object.assign({},l,{quality:k});
    });
    return Object.assign({},r,{leadRecords:recs});
  });
}

/* ---------------- helpers ---------------- */
function n(v){v=parseFloat(v);return isFinite(v)?v:0;}
/* always to the cent — rounding to whole dollars made totals disagree with Ads Manager */
function money(v){var d=2;return "$"+n(v).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function cpl(r){var l=n(r.leads);return l>0?n(r.spent)/l:null;}
function cpc(r){var c=n(r.clients);return c>0?n(r.spent)/c:null;}
function convOf(r){var l=n(r.leads);return l>0?n(r.clients)/l*100:null;}
function areasOf(r){return String(r.areas||"").split(/[,;]/).map(function(s){return s.trim();}).filter(Boolean);}
function dstr(s){if(!s)return "";var p=String(s).split("-");return p.length===3?(+p[1])+"/"+(+p[2])+"/"+p[0].slice(2):s;}
function range(r){var a=dstr(r.start),b=dstr(r.end);return a&&b?(a===b?a:a+" – "+b):(a?a+" – ongoing":(b?"ends "+b:"No dates"));}
function curPillar(){return (view.tab==="overview"||view.tab==="history"||view.tab==="sierra")?null:pillarById[view.tab];}
function pct1(v){return (Math.round(v*10)/10).toLocaleString("en-US",{minimumFractionDigits:1,maximumFractionDigits:1})+"%";}

function periodBounds(k){
  var now=new Date(),y=now.getFullYear(),m=now.getMonth();
  if(k==="m0")return [new Date(y,m,1),new Date(y,m+1,0)];
  if(k==="m1")return [new Date(y,m-1,1),new Date(y,m,0)];
  if(k==="q0"){var q=Math.floor(m/3)*3;return [new Date(y,q,1),new Date(y,q+3,0)];}
  if(k==="y0")return [new Date(y,0,1),new Date(y,11,31)];
  return null;
}
/* ---------------- date ranges over whole weeks ----------------
   Figures only ever come from complete Sat–Fri weeks. A week is counted when the
   WHOLE week sits inside the chosen range, so no week is ever half-counted and no
   week is counted twice. The live, still-running week is included the same way. */
function todayYmd(){var d=new Date();return ymd(new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),12)));}
/* Clients come from the Deal tag: when a campaign has named leads, every lead tagged
   "Deal" is one client, counted in the week the lead came in. Campaigns with no
   named leads (seminars, mailers…) keep the number typed by hand. */
function usesDealTags(r){return !!r&&Array.isArray(r.leadRecords)&&r.leadRecords.length>0;}
function dealsBetween(r,from,to){
  return r.leadRecords.filter(function(x){
    return x.quality==="deal"&&x.date&&(!from||x.date>=from)&&(!to||x.date<=to);
  }).length;
}
function rowById(id){for(var i=0;i<rows.length;i++)if(rows[i].id===id)return rows[i];return null;}
function clientsFor(r,from,to,typed){return usesDealTags(r)?dealsBetween(r,from,to):n(typed);}
/* a saved week with its client counts refreshed from today's Deal tags */
function withDeals(s){
  if(!s||!s.periodStart||!s.rows)return s;
  var rws={},tc=0;
  Object.keys(s.rows).forEach(function(id){
    var p=s.rows[id]||{}, c=clientsFor(rowById(id),s.periodStart,s.periodEnd,p.clients);
    rws[id]=Object.assign({},p,{clients:c}); tc+=c;
  });
  return Object.assign({},s,{rows:rws,totals:Object.assign({},s.totals||{},{clients:tc})});
}
function curWeekClients(r){var cur=weekStartOf(todayYmd());return clientsFor(r,cur,weekEndOf(cur),r.clients);}
function liveWeekRows(){
  var map={};
  rows.forEach(function(r){map[r.id]={name:r.name||"",pillar:r.pillar||"",segment:r.segment||"",
    spent:n(r.spent),leads:n(r.leads),clients:curWeekClients(r)};});
  return map;
}
/* every week we hold: saved weeks, plus the week in progress */
function weekSeries(){
  var out=weekSnaps().map(function(s){
    return {id:s.id,start:s.periodStart,end:s.periodEnd,label:s.label,live:false,rows:s.rows||{}};
  });
  var cur=weekStartOf(todayYmd());
  if(!out.some(function(w){return w.start===cur;})){
    out.push({id:"__live",start:cur,end:weekEndOf(cur),label:"Week of "+weekLabel(cur),live:true,rows:liveWeekRows()});
  }
  return out.sort(function(a,b){return String(a.start).localeCompare(String(b.start));});
}
function weeksInRange(from,to){
  if(!from||!to)return [];
  return weekSeries().filter(function(w){return w.start>=from&&w.end<=to;});
}
function weeksTouching(from,to){
  if(!from||!to)return [];
  return weekSeries().filter(function(w){return w.start<=to&&w.end>=from;});
}
function aggregateWeeks(ws){
  var map={};
  ws.forEach(function(w){
    Object.keys(w.rows||{}).forEach(function(id){
      var r=w.rows[id]||{};
      if(!map[id])map[id]={id:id,name:r.name||"",spent:0,leads:0,clients:0};
      map[id].spent+=n(r.spent);map[id].leads+=n(r.leads);map[id].clients+=n(r.clients);
    });
  });
  return map;
}
function addDays(d,k){var x=parseYmd(d);x.setUTCDate(x.getUTCDate()+k);return ymd(x);}
function monthBounds(back){
  var t=new Date(), y=t.getFullYear(), m=t.getMonth()-(back||0);
  var a=new Date(Date.UTC(y,m,1,12)), b=new Date(Date.UTC(y,m+1,0,12));
  return {from:ymd(a),to:ymd(b)};
}
/* null = "this week", i.e. the live rows exactly as entered */
function activeRange(){
  var k=view.period, ws=weekSeries();
  if(k==="thisweek"||!k)return null;
  if(k==="lastweek"){
    var done=ws.filter(function(w){return !w.live;});
    var last=done[done.length-1];
    return last?{from:last.start,to:last.end,kind:"weeks"}:null;
  }
  if(k==="last4"||k==="last8"){
    var cnt=k==="last4"?4:8, take=ws.slice(-cnt);
    return take.length?{from:take[0].start,to:take[take.length-1].end,kind:"weeks"}:null;
  }
  if(k==="m0"||k==="m1")return Object.assign(monthBounds(k==="m1"?1:0),{kind:"month"});
  if(k==="all")return ws.length?{from:ws[0].start,to:ws[ws.length-1].end,kind:"weeks"}:null;
  if(k==="custom"){
    if(!view.pFrom||!view.pTo)return null;
    var f=view.pFrom,t2=view.pTo;
    if(f>t2){var tmp=f;f=t2;t2=tmp;}
    return {from:f,to:t2,kind:"custom"};
  }
  return null;
}
/* Meta's own day-by-day figures. With them, any date range — a calendar month,
   custom dates — is summed day by day exactly as Ads Manager does, so nothing at
   the edge of a range is dropped. Entries typed by hand still go by whole weeks. */
function hasDays(){return !!DAYS&&Object.keys(DAYS).length>0;}
function dayAgg(from,to){
  var map={}, byName={};
  rows.forEach(function(r){if(r.name)byName[r.name]=r.id;});
  Object.keys(DAYS||{}).forEach(function(d){
    if(d<from||d>to)return;
    var o=DAYS[d]||{};
    Object.keys(o).forEach(function(nm){
      var c=o[nm]||{}, id=c.id||byName[nm]; if(!id)return;
      if(!map[id])map[id]={spent:0,leads:0};
      map[id].spent+=n(c.spent); map[id].leads+=n(c.leads);
    });
  });
  Object.keys(map).forEach(function(id){map[id].spent=Math.round(map[id].spent*100)/100;});
  return map;
}
function fromDays(r){return hasDays()&&r.pillar==="meta";}
/* every row's spend, leads and clients for a date range */
function rangeRows(from,to){
  var agg=aggregateWeeks(weeksInRange(from,to)), dm=hasDays()?dayAgg(from,to):{}, out={};
  rows.forEach(function(r){
    var a=fromDays(r)?(dm[r.id]||{spent:0,leads:0}):(agg[r.id]||{spent:0,leads:0,clients:0});
    out[r.id]={id:r.id,name:r.name||"",spent:n(a.spent),leads:n(a.leads),
      clients:fromDays(r)?clientsFor(r,from,to,0):n(a.clients)};
  });
  return out;
}
/* rows as the current range says they are */
function viewRows(){
  var rng=activeRange();
  if(!rng)return rows.map(function(r){return usesDealTags(r)?Object.assign({},r,{clients:curWeekClients(r)}):r;});
  var rr=rangeRows(rng.from,rng.to);
  return rows.map(function(r){
    var a=rr[r.id];
    return Object.assign({},r,{spent:a.spent,leads:a.leads,clients:a.clients,start:rng.from,end:rng.to});
  });
}
function sortRows(out){
  var k=view.sort,d=view.dir;
  return out.sort(function(a,b){
    var av,bv;
    if(k==="start"){av=a.start||"";bv=b.start||"";}
    else if(k==="name"){av=(a.name||"").toLowerCase();bv=(b.name||"").toLowerCase();}
    else if(k==="cpl"){av=cpl(a);bv=cpl(b);av=av==null?Infinity:av;bv=bv==null?Infinity:bv;}
    else if(k==="conv"){av=convOf(a);bv=convOf(b);av=av==null?-1:av;bv=bv==null?-1:bv;}
    else {av=n(a[k]);bv=n(b[k]);}
    return av<bv?-1*d:av>bv?1*d:0;
  });
}
function base(){
  var q=view.q.toLowerCase(), p=curPillar();
  return sortRows(viewRows().filter(function(r){
    if(p&&r.pillar!==p.id)return false;
    /* a format filter keeps only campaigns running an ad of that format */
    if(view.format&&view.tab==="meta"&&r.pillar==="meta"&&!adsOfRow(r).some(function(a){return a.format===view.format;}))return false;
    if(view.status!=="all"&&normStatus(r.status)!==view.status)return false;
    if(q){
      var hay=[r.name,r.about,r.areas,r.audience,r.ageRange,r.leadAges,r.notes,r.community,r.feedback,
        (pillarById[r.pillar]||{}).label,segLabel[r.pillar+":"+r.segment]].join(" ").toLowerCase();
      if(hay.indexOf(q)<0)return false;
    }
    return true;
  }));
}
function totals(list){
  var t={budget:0,spent:0,leads:0,clients:0,live:0};
  list.forEach(function(r){t.budget+=n(r.budget);t.spent+=n(r.spent);t.leads+=n(r.leads);t.clients+=n(r.clients);if(normStatus(r.status)==="live")t.live++;});
  t.cpl=t.leads>0?t.spent/t.leads:null;
  t.cpc=t.clients>0?t.spent/t.clients:null;
  t.conv=t.leads>0?t.clients/t.leads*100:null;
  return t;
}

/* ---------------- Saturday weeks ---------------- */
/* Weeks run Saturday through Friday — 7 days, no overlap. A Sat-to-Sat span would
   count each Saturday twice, so the end is always the Friday before the next one. */
function ymd(d){return d.toISOString().slice(0,10);}
function parseYmd(s){var p=String(s||"").split("-");return p.length===3?new Date(Date.UTC(+p[0],+p[1]-1,+p[2],12)):null;}
function weekStartOf(dateStr){
  var d=parseYmd(dateStr)||new Date();
  d=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),12));
  while(d.getUTCDay()!==6)d.setUTCDate(d.getUTCDate()-1);
  return ymd(d);
}
function weekEndOf(startStr){
  var d=parseYmd(startStr); if(!d)return "";
  d.setUTCDate(d.getUTCDate()+6);
  return ymd(d);
}
function lastCompleteWeekStart(){
  var today=new Date();
  var thisSat=weekStartOf(ymd(new Date(Date.UTC(today.getFullYear(),today.getMonth(),today.getDate(),12))));
  var d=parseYmd(thisSat);
  if(ymd(new Date())<weekEndOf(thisSat))d.setUTCDate(d.getUTCDate()-7);
  return ymd(d);
}
function shortDate(s){
  var d=parseYmd(s); if(!d)return s||"";
  var M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return M[d.getUTCMonth()]+" "+d.getUTCDate();
}
function weekLabel(start){
  var e=weekEndOf(start);
  return "Sat "+shortDate(start)+" – Fri "+shortDate(e);
}
function weeksBetween(firstStart,lastStart){
  var out=[],d=parseYmd(firstStart),end=parseYmd(lastStart);
  while(d&&end&&d<=end){out.push(ymd(d));d.setUTCDate(d.getUTCDate()+7);}
  return out;
}

/* ---------------- snapshots & comparison ---------------- */
function snapById(id){ for(var i=0;i<snaps.length;i++) if(snaps[i].id===id) return snaps[i]; return null; }
function activeSnap(){
  if(view.compare==="custom"){
    if(!view.cFrom||!view.cTo)return null;
    var f=view.cFrom,t=view.cTo;
    if(f>t){var x=f;f=t;t=x;}
    var ws=weeksInRange(f,t);
    if(!ws.length&&!hasDays())return null;
    var agg=rangeRows(f,t), tot={spent:0,leads:0,clients:0};
    Object.keys(agg).forEach(function(k){tot.spent+=agg[k].spent;tot.leads+=agg[k].leads;tot.clients+=agg[k].clients;});
    return {id:"custom",label:shortDate(f)+" – "+shortDate(t),takenAt:new Date().toISOString(),
      periodStart:f,periodEnd:t,rows:agg,totals:tot,synthetic:true,weeks:ws.length};
  }
  return view.compare?withDeals(snapById(view.compare)):null;
}
function prevRow(r){ var s=activeSnap(); return (s&&s.rows&&s.rows[r.id])?s.rows[r.id]:null; }
/* Snapshot totals, summed over exactly the rows on screen — so a filtered view compares like with like. */
function prevTotals(list){
  var s=activeSnap(); if(!s||!s.rows)return null;
  var t={spent:0,leads:0,clients:0}, any=false;
  list.forEach(function(r){
    var p=s.rows[r.id];
    if(p){any=true;t.spent+=n(p.spent);t.leads+=n(p.leads);t.clients+=n(p.clients);}
  });
  if(!any)return null;
  t.cpl=t.leads>0?t.spent/t.leads:null;
  t.conv=t.leads>0?t.clients/t.leads*100:null;
  return t;
}
/* dir: 1 = up is good, -1 = down is good, 0 = neither */
function delta(cur,prev,dir,fmt){
  if(prev==null||cur==null||!isFinite(prev)||!isFinite(cur))return "";
  var d=cur-prev;
  if(Math.abs(d)<0.005)return '<span class="dl flat">No change</span>';
  var cls="neutral";
  if(dir>0)cls=(d>0?"up":"down");
  else if(dir<0)cls=(d<0?"up":"down");
  var pct=(prev!==0)?Math.abs(d)/Math.abs(prev)*100:null;
  var label=(pct==null)?"new":(pct>=1000?"+1000%":pct1(pct));
  var abs=fmt?fmt(Math.abs(d)):Math.abs(d).toLocaleString("en-US");
  return '<span class="dl '+cls+'" title="'+(d>0?"Up ":"Down ")+esc(abs)+' since the snapshot">'+(d>0?"▲":"▼")+" "+label+'</span>';
}
function saveSnapshot(label,weekStart){
  var map={};
  rows.forEach(function(r){ map[r.id]={name:r.name||"",pillar:r.pillar||"",segment:r.segment||"",
    spent:n(r.spent),leads:n(r.leads),clients:weekStart?clientsFor(r,weekStart,weekEndOf(weekStart),r.clients):curWeekClients(r)}; });
  var t=totals(rows); t.clients=0;
  Object.keys(map).forEach(function(k){t.clients+=map[k].clients;});
  var doc={label:label||(weekStart?("Week of "+weekLabel(weekStart)):("Snapshot "+new Date().toLocaleDateString("en-US"))),
    takenAt:new Date().toISOString(),
    rows:map,totals:{budget:t.budget,spent:t.spent,leads:t.leads,clients:t.clients},count:rows.length};
  if(weekStart){doc.periodStart=weekStart;doc.periodEnd=weekEndOf(weekStart);}
  var id="s"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  snaps.unshift(Object.assign({id:id},doc));
  dbSnaps.unshift(Object.assign({id:id},doc));
  view.compare=id;
  closeModal(); render();
  if(dbRef) dbRef.collection("snapshots").doc(id).set(doc).catch(onWriteFail); else localSave();
}
function removeSnapshot(id){
  snaps=snaps.filter(function(s){return s.id!==id;});
  dbSnaps=dbSnaps.filter(function(s){return s.id!==id;});
  if(liveSnaps)liveSnaps=liveSnaps.filter(function(s){return s.id!==id;});
  if(view.compare===id)view.compare="";
  if(dbRef) dbRef.collection("snapshots").doc(id).delete().catch(onWriteFail); else localSave();
  if(document.getElementById("modalHost").innerHTML) openSnapDialog(); else render();
}

/* ---------------- render pieces ---------------- */
function tile(l,v,m,hero,dl){
  return '<div class="tile'+(hero?" hero":"")+'"><span class="lbl">'+esc(l)+'</span><span class="v">'+esc(v)+'</span>'+
    (dl||"")+'<span class="m">'+esc(m)+'</span></div>';
}
function th(k,l,cls){var on=view.sort===k;return '<th class="s '+(cls||"")+'" data-sort="'+k+'">'+esc(l)+' <span class="ar">'+(on?(view.dir>0?"▲":"▼"):"")+'</span></th>';}

/* One lead per line: "Lead name - Agent" (also accepts > or an arrow). */
function parseLeads(t){
  if(!t)return [];
  return String(t).split(/\r?\n/).map(function (line) {
    var L = line.trim(); if (!L) return null;
    var m = L.split(/\s*(?:->|=>|→|>|–|—|-|:|\|)\s*/);
    var who=(m[0]||"").trim();
    var to=m.slice(1).join(" ").trim();
    return who?{who:who,to:to}:null;
  }).filter(Boolean);
}
var QUALITY=[
  {id:"new",   label:"Not set"},
  {id:"active",label:"Active"},
  {id:"qual",  label:"Qualified"},
  {id:"deal",  label:"Deal"},
  {id:"junk",  label:"Junk"}
];
/* Lead records come from Meta when the token can read them; anything typed by
   hand into the text box is merged in so nothing is ever lost. */
function leadRecords(r){
  var out=[];
  (Array.isArray(r.leadRecords)?r.leadRecords:[]).forEach(function(x,i){
    out.push({id:x.id||("r"+i),name:x.name||"Unnamed lead",agent:x.agent||"",
      date:x.date||"",quality:x.quality||"new",src:"meta"});
  });
  parseLeads(r.leadList).forEach(function(x,i){
    if(out.some(function(o){return o.name.toLowerCase()===x.who.toLowerCase();}))return;
    out.push({id:"m"+i,name:x.who,agent:x.to||"",date:"",quality:x.quality||"new",src:"typed"});
  });
  return out;
}
function qTally(list){
  var c={};
  list.forEach(function(x){c[x.quality]=(c[x.quality]||0)+1;});
  return QUALITY.filter(function(q){return c[q.id];})
    .map(function(q){return '<span class="t-'+q.id+'">'+c[q.id]+' '+esc(q.label.toLowerCase())+'</span>';}).join("");
}
function viewBounds(){
  var rng=activeRange();
  if(rng)return {from:rng.from,to:rng.to};
  var cur=weekStartOf(todayYmd());
  return {from:cur,to:weekEndOf(cur)};
}
function leadsCell(r){
  var everything=leadRecords(r), b=viewBounds();
  var list=everything.filter(function(x){ return !x.date || (x.date>=b.from && x.date<=b.to); });
  var cnt=n(r.leads), allCount=everything.length;
  var allNote=(allCount>list.length)
    ? '<span class="leadMore">'+allCount+' all time — pick All time to see every name</span>' : '';
  if(!cnt&&!list.length)return '<span class="noLeads">none in this period</span>'+allNote;
  if(!list.length){
    return '<span class="noLeads">'+cnt+' lead'+(cnt===1?"":"s")+'</span>'+
      '<span class="leadMissing">no names yet</span>'+allNote;
  }
  /* Collapsed by default. A native <details> toggle — the browser handles the
     click itself, so it cannot fail to open. Open/closed is remembered so
     changing a tag does not snap the list shut. */
  var shown=list.slice().sort(function(a,b){return String(b.date).localeCompare(String(a.date));});
  var open=!!view.openLeads[r.id];
  var h='<details class="leadDrop" data-leadrow="'+esc(r.id)+'"'+(open?' open':'')+'>'+
    '<summary><span class="cv">▸</span>'+list.length+' name'+(list.length===1?"":"s")+'</summary>'+
    '<div class="leadPanel">'+shown.map(function(x){
    return '<div class="leadItem"><div class="leadWho">'+
      '<div class="nm">'+esc(x.name)+'</div>'+
      (x.agent?'<div class="to">Agent: <b>'+esc(x.agent)+'</b>'+(x.sierra==="existing"?' <span class="dt">(existing contact)</span>':'')+'</div>'
        :x.sierra==="missing"?'<div class="to" style="color:var(--bad)">Not in Sierra</div>'
        :x.sierra==="ambiguous"?'<div class="to" style="color:var(--warn)">Several matches in Sierra — check by hand</div>'
        :'')+
      '<div class="dt">'+(x.date?esc(shortDate(x.date)):"")+'</div>'+
    '</div>'+
    '<select class="qsel q-'+x.quality+'" data-lq="'+esc(r.id)+'" data-lid="'+esc(x.id)+'"'+
      (canWrite===false?' disabled':'')+'>'+
      QUALITY.map(function(q){
        return '<option value="'+q.id+'"'+(x.quality===q.id?" selected":"")+'>'+q.label+'</option>';
      }).join("")+'</select></div>';
  }).join("")+'</div></details>';
  var nDeal=list.filter(function(x){return x.quality==="deal";}).length;
  if(qTally(list))h+='<div class="qTally">'+qTally(list)+
    (nDeal&&list.length?'<span class="t-deal">'+pct1(nDeal/list.length*100)+' became clients</span>':"")+'</div>';
  if(cnt&&cnt!==list.length)
    h+='<span class="leadMissing">'+list.length+' named of '+cnt+'</span>';
  return h+allNote;
}
function parseAgeSpend(s){
  if(!s)return [];
  return String(s).split(/[,;]/).map(function(part){
    var i=part.lastIndexOf(":"); if(i<0)return null;
    var label=part.slice(0,i).trim(), v=parseFloat(part.slice(i+1).replace(/[^0-9.]/g,""));
    return (label&&isFinite(v)&&v>0)?{label:label,v:v}:null;
  }).filter(Boolean);
}
function demoLine(k,v,clamp){
  return '<div class="demoLine'+(clamp?" clamp":"")+'"><span class="k">'+esc(k)+'</span><span class="v"'+
    (clamp?' title="'+esc(String(v).replace(/<[^>]*>/g,""))+'"':"")+'>'+v+'</span></div>';
}
function demoCell(r){
  var chips=[];
  if(r.ageRange)chips.push(r.ageRange);
  if(r.gender&&r.gender!=="All")chips.push(r.gender);
  var parts=parseAgeSpend(r.ageSpend), out="";
  if(chips.length) out+='<div class="demoChips">'+chips.map(function(c){return '<span class="dchip">'+esc(c)+'</span>';}).join("")+'</div>';
  if(parts.length){
    var tot=parts.reduce(function(a,b){return a+b.v;},0);
    var top=parts.slice().sort(function(a,b){return b.v-a.v;})[0];
    out+='<div class="agebar" role="img" aria-label="Spend by age bracket">'+
      parts.map(function(p,i){return '<i class="s'+Math.min(i,5)+'" style="flex:'+p.v+'" title="'+esc(p.label)+' — '+money(p.v,true)+'"></i>';}).join("")+
      '</div>'+demoLine("Spend","<b>"+esc(top.label)+"</b> took the most, "+money(top.v,true)+" of "+money(tot,true));
  }
  if(r.leadAges) out+=demoLine("Leads","<b>"+esc(r.leadAges)+"</b>");
  if(r.audience) out+=demoLine("Who",esc(r.audience),true);
  return '<div class="demo">'+(out||'<span class="meta">—</span>')+'</div>';
}

/* The table is the entry and its figures. Pillar, Inside pillar, Demographics
   and Areas are all off it; on All pillars the rail above still breaks spend
   down by pillar, and clicking one of its cards opens that pillar's tab. */
function row(r,extras,noRates){
  var st=STATUS[normStatus(r.status)];
  var c=cpl(r), cv=convOf(r), pr=prevRow(r);
  var pcplv=(pr&&n(pr.leads)>0)?n(pr.spent)/n(pr.leads):null;
  var pconv=(pr&&n(pr.leads)>0)?n(pr.clients)/n(pr.leads)*100:null;
  var cells='<td><div class="name">'+esc(r.name||"Untitled")+'</div>'+
    (r.firstRan?'<span class="ran">Running since '+esc(shortDate(r.firstRan))+'</span>':"")+
    '</td>';
  cells+='<td><span class="chip '+st.cls+'">'+st.label+'</span></td>'+
    '<td class="meta num">'+esc(range(r))+'</td>';
  extras.forEach(function(k){cells+='<td class="wrapcell">'+(r[k]?esc(r[k]):"—")+'</td>';});
  cells+='<td class="r money">'+(n(r.budget)?money(r.budget):"—")+'</td>'+
    '<td class="r money">'+money(r.spent)+(pr?delta(n(r.spent),n(pr.spent),0,function(v){return money(v,true);}):"")+'</td>'+
    '<td class="r cnt">'+n(r.leads).toLocaleString()+(pr?delta(n(r.leads),n(pr.leads),1):"")+'</td>'+
    '<td>'+leadsCell(r)+'</td>'+
    (noRates?"":'<td class="r cpl">'+(c==null?"—":money(c,true))+(pr?delta(c,pcplv,-1,function(v){return money(v,true);}):"")+'</td>')+
    '<td class="r cnt">'+n(r.clients).toLocaleString()+(pr?delta(n(r.clients),n(pr.clients),1):"")+'</td>'+
    (noRates?"":'<td class="r cpl">'+(cv==null?"—":pct1(cv))+(pr?delta(cv,pconv,1,function(v){return pct1(v);}):"")+'</td>')+
    '<td><div class="acts"><button class="btn sm" data-edit="'+esc(r.id)+'">'+(canWrite===false?"View":"Edit")+'</button></div></td>';
  return '<tr data-id="'+esc(r.id)+'">'+cells+'</tr>';
}

/* ---------------- the Meta tab, Apple-style ----------------
   Same figures, same controls, arranged as bands: the number that matters,
   then the ads, then where the money went. Every control the table had is
   still here — sorting, the sub-channel filter, lead names and Edit. */
/* "Campaign / ad set" is a form label, not a word you can count. Take the
   first half and pluralise it properly. */
function aWord(item,cnt){
  var w=String(item||"entry").split("/")[0].trim().toLowerCase();
  if(cnt===1)return w;
  return /[^aeiou]y$/.test(w)?w.slice(0,-1)+"ies":(/(s|sh|ch|x|z)$/.test(w)?w+"es":w+"s");
}
function aFig(v,l,dl,accent){
  return '<div><span class="v'+(accent?' q':'')+'">'+v+'</span>'+
    '<span class="l">'+esc(l)+'</span>'+(dl||"")+'</div>';
}
function aPill(attr,label,count,on){
  return '<button class="aPill" '+attr+' aria-pressed="'+(!!on)+'">'+esc(label)+
    (count==null?"":'<span class="n">'+count+'</span>')+'</button>';
}
/* the sentence under the big figure, in plain words */
function aSentence(t,list){
  if(!n(t.spent)&&!n(t.leads))return "Nothing has run in this period.";
  var p=[];
  p.push("You spent <b>"+money(t.spent)+"</b>");
  p.push(n(t.leads)?("<b>"+n(t.leads).toLocaleString()+(n(t.leads)===1?" person":" people")+"</b> enquired"):"nobody enquired");
  var s=p.join(" and ")+".";
  if(n(t.clients))s+=" <b>"+n(t.clients)+"</b> of them became "+(n(t.clients)===1?"a client":"clients")+".";
  return s;
}
function aAdsHeadline(ads){
  var f={}; ads.forEach(function(a){f[a.format]=1;});
  var kinds=Object.keys(f);
  var word=ads.length===1?"One ad.":(ads.length+" ads.");
  if(kinds.length===1)return word+" All "+fmtLabel(kinds[0]).toLowerCase()+".";
  return word+" "+kinds.map(function(k){return fmtLabel(k);}).join(" and ")+".";
}
function aRow(r,noRates,extras){
  var st=STATUS[normStatus(r.status)], c=cpl(r), cv=convOf(r), pr=prevRow(r);
  var pcpl=(pr&&n(pr.leads)>0)?n(pr.spent)/n(pr.leads):null;
  return '<div class="aRow'+(normStatus(r.status)==="live"?"":" off")+'" data-id="'+esc(r.id)+'">'+
    '<div class="aMain"><div class="aNm">'+esc(r.name||"Untitled")+'</div>'+
      '<div class="aSt"><span class="chip '+st.cls+'">'+st.label+'</span><span>'+esc(range(r))+'</span></div>'+
      /* Mailers and Events keep their own fields; they are prose, so they read
         better under the name than squeezed into a column */
      ((extras||[]).filter(function(k){return r[k];}).length
        ? '<div class="aExtra">'+(extras||[]).filter(function(k){return r[k];}).map(function(k){
            return '<span><b>'+esc(EXTRA[k].col)+'</b> '+esc(r[k])+'</span>';}).join("")+'</div>'
        : "")+
    '</div>'+
    '<div class="aFigs">'+
      aFig(money(r.spent),"spent",pr?delta(n(r.spent),n(pr.spent),0,function(v){return money(v);}):"")+
      aFig(n(r.leads).toLocaleString(),"leads",pr?delta(n(r.leads),n(pr.leads),1):"")+
      (noRates?"":aFig(c==null?"—":money(c),"per lead",
        pr?delta(c,pcpl,-1,function(v){return money(v);}):"",true))+
      aFig(n(r.clients).toLocaleString(),"clients",pr?delta(n(r.clients),n(pr.clients),1):"")+
      (noRates?"":aFig(cv==null?"—":pct1(cv),"to client",""))+
    '</div>'+
    '<div class="aTools">'+leadsCell(r)+
      '<button class="btn sm" data-edit="'+esc(r.id)+'">'+(canWrite===false?"View":"Edit")+'</button></div>'+

      return aPill('data-tab="'+esc(l.pillar)+'"'+
        (l.group?' data-metasub="'+esc(l.group.key)+'"':""),l.label,money(totals(sub).spent),false);
    }).join("")+'</div>';

      '<div class="aTot"><span>'+(sec.label?esc(sec.label):"Total")+'</span>'+
      '<span><b>'+money(t.spent)+'</b> spent &nbsp; <b>'+n(t.leads).toLocaleString()+'</b> leads'+
      (sec.noRates?"":' &nbsp; <b>'+(t.cpl==null?"—":money(t.cpl))+'</b> per lead')+
      ' &nbsp; <b>'+n(t.clients).toLocaleString()+'</b> clients</span></div></div>';
  }
  h+='</div></div>';
  return h+'</section>';
}

function sectionHtml(sec){
  if(sec.apple) return appleSection(sec);
  var segKey=view.seg[sec.key]||"all";
  var list=segKey==="all"?sec.rows:sec.rows.filter(function(r){return (r.segment||"")===segKey;});

    (sec.note?'<p>'+esc(sec.note)+'</p>':"")+'</div>';

  html+='<div class="tiles">'+[
    tile("Budget spent",money(t.spent),
      (t.budget>0?"of "+money(t.budget)+" budgeted":"No budget target set")+(scoped?" · "+money(totals(sec.all).spent)+" all time":""),true,
      pt?delta(t.spent,pt.spent,0,function(v){return money(v,true);}):""),
    tile("Leads",n(t.leads).toLocaleString(),list.length+" entr"+(list.length===1?"y":"ies")+" in view",false,
      pt?delta(t.leads,pt.leads,1):""),
    sec.noRates?"":tile("Cost per lead",t.cpl==null?"—":money(t.cpl,true),t.cpl==null?"No leads logged yet":"Spend ÷ leads",false,
      pt?delta(t.cpl,pt.cpl,-1,function(v){return money(v,true);}):""),
    tile("Clients closed",n(t.clients).toLocaleString(),t.cpc==null?"None closed yet":money(t.cpc,true)+" per client",false,
      pt?delta(t.clients,pt.clients,1):""),
    sec.noRates?"":tile("Lead → client",t.conv==null?"—":pct1(t.conv),t.conv==null?"Fill in clients to track this":n(t.clients)+" of "+n(t.leads)+" leads closed",false,
      pt?delta(t.conv,pt.conv,1,function(v){return pct1(v);}):""),

  ].join("")+'</div>';

  if(sec.rail==="lanes"){

    var max=Math.max.apply(null,[1].concat(spends));
    html+='<div class="lbl" style="margin-bottom:10px">Spend by pillar</div><div class="rail">'+
      ls.map(function(l,i){
        var sub=sec.rows.filter(function(r){return r.pillar===l.pillar&&inGroup(r,l.group);});
        var pl=pillarById[l.pillar];
        return railCard('data-tab="'+l.pillar+'"',l.label,sub.length,spends[i],max,totals(sub),
          (pl.planned&&!sub.length)?"Not started":null,null);
      }).join("")+'</div>';
  } else if(sec.segs&&sec.segs.length>1){
    var allT=totals(sec.rows);
    var segSpend=sec.segs.map(function(s){return totals(sec.rows.filter(function(r){return r.segment===s.id;})).spent;});
    var smax=Math.max.apply(null,[1].concat(segSpend).concat([allT.spent||1]));

      railCard('data-seg="all" data-sec="'+esc(sec.key)+'"',"Everything",sec.rows.length,allT.spent,smax,allT,null,segKey==="all")+
      sec.segs.map(function(s,i){
        var sub=sec.rows.filter(function(r){return r.segment===s.id;});
        return railCard('data-seg="'+s.id+'" data-sec="'+esc(sec.key)+'"',s.label,sub.length,segSpend[i],smax,totals(sub),null,segKey===s.id);
      }).join("")+'</div>';
  }

  html+=adBlockHtml(sec);
  html+=tableFor(sec,list,sec.extras||[],sec.item||"Entry");
  return html+'</section>';
}
function railCard(attr,label,count,spent,max,pt,badge,pressed){

/* ---------------- ads: format, artwork and what they cost ----------------
   One record per ad that is running, straight from Meta (pull-creatives.js):
   what kind of ad it is, the words on it, its artwork, and its own spend and
   leads day by day — so a format totals exactly over whatever dates are
   showing, rather than taking a share of its campaign's figures. */
var FORMATS=[{id:"video",label:"Video"},{id:"carousel",label:"Carousel"},{id:"image",label:"Single image"}];
function fmtLabel(f){for(var i=0;i<FORMATS.length;i++)if(FORMATS[i].id===f)return FORMATS[i].label;return "Other";}
function adBounds(){var vb=viewBounds();return view.period==="all"?{from:"2000-01-01",to:vb.to}:vb;}
/* an ad's spend and leads inside the dates on screen */
function adFigs(a,from,to){
  var t={spent:0,leads:0}, d=a.days||{};
  Object.keys(d).forEach(function(k){
    if(k<from||k>to)return;
    t.spent+=n(d[k].spent); t.leads+=n(d[k].leads);
  });
  t.spent=Math.round(t.spent*100)/100;
  t.cpl=t.leads>0?t.spent/t.leads:null;
  return t;
}
function adsOfRow(r){return ADS.filter(function(a){return a.campaign&&a.campaign===r.name;});}
/* the ads belonging to the campaigns on this page, biggest spend first */
function adsForRows(list){
  var names={}; list.forEach(function(r){if(r.name)names[r.name]=1;});
  var b=adBounds();

/* Whole team table — every agent, ALL leads (not only Meta), for its own time
   frame. Calls come from every call in Sierra by day; new leads, never viewed,
   no call yet and logins are Sierra's own accountability numbers, added up
   day by day so any date range is exact. */
var SX_TEAM_RANGES=[["today","Today"],["week","This week"],["7","Last 7 days"],["14","Last 14 days"],["month","This month"],["30","Last 30 days"],["custom","Custom…"]];
function sxTeamBounds(){
  var t=todayYmd(), k=view.teamRange||"7";
  if(k==="today")return {from:t,to:t};
  if(k==="week")return {from:weekStartOf(t),to:t};
  if(k==="7")return {from:addDays(t,-6),to:t};
  if(k==="14")return {from:addDays(t,-13),to:t};
  if(k==="month")return {from:t.slice(0,8)+"01",to:t};
  if(k==="30")return {from:addDays(t,-29),to:t};
  var f=view.tFrom||addDays(t,-6), to=view.tTo||t; if(f>to){var x=f;f=to;to=x;} return {from:f,to:to};
}
function sxTeamAgg(){
  var b=sxTeamBounds(), C=SIERRA.calls||{}, D=SIERRA.days||{}, ag={};
  var A=function(n){return ag[n]=ag[n]||{name:n,calls:0,talk:0,leads:{},days:{},newLeads:0,notViewed:0,noCalls:0,sessions:0,fc:[]};};
  /* calls made in the range, by the agent who made them */
  var firstCall={};
  Object.keys(C).forEach(function(k){
    var p=k.split("|"), day=p[0], who=p[1], sid=p[2], v=C[k], t=day+"T"+v[2];
    if(!firstCall[sid]||t<firstCall[sid])firstCall[sid]=t;
    if(day<b.from||day>b.to)return;
    var a=A(who); a.calls+=n(v[0]); a.talk+=n(v[1]); a.leads[sid]=1; a.days[day]=1;
  });
  /* Sierra's accountability numbers, day by day */
  Object.keys(D).forEach(function(day){ if(day<b.from||day>b.to)return;
    D[day].forEach(function(g){var a=A(g[0]); a.sessions+=n(g[1]); a.newLeads+=n(g[2]); a.notViewed+=n(g[3]); a.noCalls+=n(g[5]);}); });
  /* avg time to first call: new leads signed up in the range, sign-up → first call by anyone */
  var hide={}; (SIERRA.hide||[]).forEach(function(x){hide[x]=1;});
  sierraLeads(b.from,b.to).concat(sierraOther(b.from,b.to)).forEach(function(x){
    if(!x.agent||hide[x.agent]||x.s.status!=="ok")return; var fc=firstCall[x.s.sid], st=x.time||(x.date+"T12:00");
    var m=sxMin(st,fc); if(m!=null&&m>=0)A(x.agent).fc.push(m); });
  var list=Object.keys(ag).map(function(k){return ag[k];}).filter(function(a){return !hide[a.name]&&(a.calls||a.newLeads||a.sessions);})
    .sort(function(x,y){return y.calls-x.calls||y.newLeads-x.newLeads||x.name.localeCompare(y.name);});
  var tot={calls:0,talk:0,leads:{},newLeads:0,notViewed:0,noCalls:0,sessions:0};
  list.forEach(function(a){tot.calls+=a.calls;tot.talk+=a.talk;Object.keys(a.leads).forEach(function(s){tot.leads[s]=1;});tot.newLeads+=a.newLeads;tot.notViewed+=a.notViewed;tot.noCalls+=a.noCalls;tot.sessions+=a.sessions;});
  return {b:b,list:list,tot:tot,
    nDays:Math.round((Date.parse(b.to+"T12:00:00Z")-Date.parse(b.from+"T12:00:00Z"))/864e5)+1};
}

/* ---------------- history ---------------- */
function weekSnaps(){
  return snaps.filter(function(s){return s.periodStart;})
    .map(withDeals).sort(function(a,b){return String(a.periodStart).localeCompare(String(b.periodStart));});
}
function snapTotals(s){
  var t={spent:0,leads:0,clients:0};
  if(s&&s.totals){t.spent=n(s.totals.spent);t.leads=n(s.totals.leads);t.clients=n(s.totals.clients);}
  t.cpl=t.leads>0?t.spent/t.leads:null;
  return t;
}
/* One bar per day. Spend sets the height; leads are printed above the bar.
   A day that spent money and returned nothing is drawn in red. */
function dailyHtml(){
  var keys=Object.keys(DAYS||{}).sort();
  if(!keys.length)return "";
  keys=keys.slice(-42);
  var tot=keys.map(function(d){
    var s=0,l=0;
    Object.keys(DAYS[d]||{}).forEach(function(cn){var c=DAYS[d][cn]||{};s+=n(c.spent);l+=n(c.leads);});
    return {d:d,spent:s,leads:l};
  });
  var max=Math.max.apply(null,[0.01].concat(tot.map(function(x){return x.spent;})));
  var sum=tot.reduce(function(a,b){return {spent:a.spent+b.spent,leads:a.leads+b.leads};},{spent:0,leads:0});
  var spentDays=tot.filter(function(x){return x.spent>0;});
  var dead=spentDays.filter(function(x){return x.leads===0;});
  var best=null; spentDays.forEach(function(x){ if(x.leads>0&&(!best||x.spent/x.leads<best.spent/best.leads))best=x; });

  var bars=tot.map(function(x){
    var sat=parseYmd(x.d).getUTCDay()===6;
    var h=Math.max(1,Math.round(x.spent/max*100));
    var cls=x.spent<=0?"none":(x.leads===0?"zero":"");
    return '<span class="dcol'+(sat?" satstart":"")+'" title="'+esc(shortDate(x.d))+': '+esc(money(x.spent,true))+', '+x.leads+' lead'+(x.leads===1?"":"s")+'">'+
      (x.leads?'<span class="ld">'+x.leads+'</span>':"")+
      '<i class="bar '+cls+'" style="height:'+h+'%"></i></span>';
  }).join("");
  var axis=tot.map(function(x){
    var dt=parseYmd(x.d), sat=dt.getUTCDay()===6;
    return '<span class="dax'+(sat?" satstart":"")+'">'+(sat?'<b>'+esc(shortDate(x.d).split(" ")[0])+'</b>':"")+dt.getUTCDate()+'</span>';
  }).join("");

  var h2='<section class="sec">';
  h2+='<div class="secHead"><h3>Day by day</h3><span class="mark">Last '+tot.length+' days</span>'+
    '<p>Bar height is money spent that day. The number above a bar is leads. A red bar means money went out and nothing came back.</p></div>';
  h2+='<div class="panel" style="padding:20px 22px 14px">'+
    '<div class="dayScroll"><div class="dayChart">'+bars+'</div><div class="dayAxis">'+axis+'</div></div>'+
    '<div class="dayKey"><span><i style="background:var(--brass)"></i>spent and got leads</span>'+
    '<span><i style="background:var(--bad);opacity:.5"></i>spent, no leads</span>'+
    '<span><i style="background:var(--surface-2)"></i>nothing spent</span>'+
    '<span>vertical rule marks each Saturday, the start of a week</span></div></div>';
  h2+='<div class="tiles" style="margin-top:18px">'+[
    tile("Spent in view",money(sum.spent,true),tot.length+" days · "+spentDays.length+" with delivery",true),
    tile("Leads in view",String(sum.leads),sum.leads?money(sum.spent/sum.leads,true)+" per lead":"none yet"),
    tile("Busiest day",spentDays.length?money(Math.max.apply(null,spentDays.map(function(x){return x.spent;})),true):"—","most spent in one day"),
    tile("Days with nothing back",String(dead.length),dead.length?money(dead.reduce(function(a,b){return a+b.spent;},0),true)+" spent for no leads":"every spending day produced a lead"),
    tile("Best day",best?money(best.spent/best.leads,true):"—",best?esc(shortDate(best.d))+" · "+best.leads+" lead"+(best.leads===1?"":"s"):"no leads yet")
  ].join("")+'</div>';
  return h2+'</section>';
}

function historyHtml(){
  var ws=weekSnaps(), loose=snaps.filter(function(s){return !s.periodStart;});
  var h=dailyHtml();
  h+='<section class="sec">';
  h+='<div class="secHead"><h3>Week by week</h3><span class="mark">Sat – Fri</span>'+
     '<p>Every saved week, oldest first. Weeks run Saturday to Friday so none of them overlap.</p></div>';

  if(!ws.length){
    h+='<div class="panel"><div class="empty"><h3>No weeks saved yet</h3>'+
      '<p>Use <b>Save snapshot</b> to freeze a week’s spend, leads and clients. Each one is kept here so you can look back at any week and compare it with another.</p>'+
      (canWrite===false?'':'<button class="btn pri" id="snapBtn2">Save this week</button>')+'</div></div>';
    if(loose.length)h+='<div class="hnote">'+loose.length+' saved snapshot'+(loose.length===1?"":"s")+
      ' have no week attached. Open Save snapshot to give them a week, or leave them for comparisons only.</div>';
    return h+'</section>';
  }

  /* gaps in the run of weeks */
  var span=weeksBetween(ws[0].periodStart,ws[ws.length-1].periodStart);
  var have={}; ws.forEach(function(s){have[s.periodStart]=1;});
  var missing=span.filter(function(d){return !have[d];});
  if(missing.length)h+='<div class="hnote">Missing '+missing.length+' week'+(missing.length===1?"":"s")+
    ' between '+esc(shortDate(ws[0].periodStart))+' and '+esc(shortDate(ws[ws.length-1].periodStart))+': '+
    esc(missing.map(shortDate).join(", "))+'.</div>';

  var maxSpent=1,maxLeads=1,maxCpl=1;
  ws.forEach(function(s){var t=snapTotals(s);
    if(t.spent>maxSpent)maxSpent=t.spent; if(t.leads>maxLeads)maxLeads=t.leads;
    if(t.cpl!=null&&t.cpl>maxCpl)maxCpl=t.cpl;});

  h+='<div class="panel" style="padding:18px 20px 8px">';
  h+='<div class="hrow head"><span>Week</span><span>Spent</span><span>Leads</span><span>Cost / lead</span><span></span></div>';
  ws.forEach(function(s,i){
    var t=snapTotals(s), pv=i>0?snapTotals(ws[i-1]):null;
    var bar=function(v,max,cls){return '<span class="mb"><i class="'+(cls||"")+'" style="width:'+
      Math.max(2,Math.min(100,v/max*100)).toFixed(1)+'%"></i></span>';};
    h+='<div class="hrow'+(view.compare===s.id?" cur":"")+'">'+
      '<span class="wk">'+esc(weekLabel(s.periodStart))+'<small>'+esc(s.label||"")+'</small></span>'+
      '<span class="hcell"><span class="v">'+money(t.spent,true)+'</span>'+bar(t.spent,maxSpent)+
        (pv?delta(t.spent,pv.spent,0,function(v){return money(v,true);}):"")+'</span>'+
      '<span class="hcell"><span class="v">'+t.leads+'</span>'+bar(t.leads,maxLeads,"g")+
        (pv?delta(t.leads,pv.leads,1):"")+'</span>'+
      '<span class="hcell"><span class="v brass">'+(t.cpl==null?"—":money(t.cpl,true))+'</span>'+
        (t.cpl==null?'<span class="mb"></span>':bar(t.cpl,maxCpl))+
        (pv?delta(t.cpl,pv.cpl,-1,function(v){return money(v,true);}):"")+'</span>'+
      '<span><button class="pick" data-pick="'+esc(s.id)+'" aria-pressed="'+(view.compare===s.id)+'">'+
        (view.compare===s.id?"Comparing":"Compare")+'</button></span>'+
    '</div>';
  });
  h+='</div>';

  var first=snapTotals(ws[0]), last=snapTotals(ws[ws.length-1]);
  if(ws.length>1){
    h+='<div class="tiles" style="margin-top:20px">'+[
      tile("Weeks saved",String(ws.length),esc(shortDate(ws[0].periodStart))+" to "+esc(shortDate(ws[ws.length-1].periodStart)),true),
      tile("Spent across all weeks",money(ws.reduce(function(a,s){return a+snapTotals(s).spent;},0),true),"total of every saved week"),
      tile("Leads across all weeks",String(ws.reduce(function(a,s){return a+snapTotals(s).leads;},0)),"total of every saved week"),
      tile("Cost per lead now",last.cpl==null?"—":money(last.cpl,true),
        first.cpl==null?"first week had no leads":"first saved week was "+money(first.cpl,true),false,
        (first.cpl!=null&&last.cpl!=null)?delta(last.cpl,first.cpl,-1,function(v){return money(v,true);}):"")
    ].join("")+'</div>';
  }
  return h+'</section>';
}

function rangeNoteHtml(){
  var rng=activeRange(), el=[];
  if(!rng){
    var cur=weekStartOf(todayYmd());
    return '<div class="rnote"><span class="tag">This week</span><span><b>'+esc(weekLabel(cur))+'</b> — still running, so the figures move until Friday.</span></div>';
  }
  if(hasDays()&&view.tab==="meta"){
    var last=Object.keys(DAYS).sort().pop(), upto=rng.to>last?last:rng.to;
    return '<div class="rnote"><span class="tag">'+esc(shortDate(rng.from)+" – "+shortDate(rng.to))+'</span><span><b>Every day counted</b> — '+
      esc(shortDate(rng.from))+' to '+esc(shortDate(upto))+', added up day by day from Meta’s own figures, the same way Ads Manager totals it.</span></div>';
  }
  var inr=weeksInRange(rng.from,rng.to), touch=weeksTouching(rng.from,rng.to);
  /* compare by week start — each call builds fresh week objects */
  var inStarts={}; inr.forEach(function(w){inStarts[w.start]=1;});
  var partial=touch.filter(function(w){return !inStarts[w.start];});
  var live=inr.filter(function(w){return w.live;}).length;
  var txt='<b>'+inr.length+' complete week'+(inr.length===1?"":"s")+'</b>';
  if(inr.length)txt+=' — '+esc(shortDate(inr[0].start))+' to '+esc(shortDate(inr[inr.length-1].end));
  else txt='<b class="warn">No complete week falls inside these dates.</b>';
  if(live)txt+=' · includes the week still running';
  var warn="";
  if(partial.length)warn='<span class="warn">'+partial.length+' week'+(partial.length===1?"":"s")+' only partly inside these dates '+
    '('+esc(partial.map(function(w){return shortDate(w.start);}).join(", "))+') left out, so nothing is counted twice or by halves.</span>';
  return '<div class="rnote"><span class="tag">'+esc(shortDate(rng.from)+" – "+shortDate(rng.to))+'</span><span>'+txt+(warn?" "+warn:"")+'</span></div>';
}
/* Redraw without losing your place: keeps the page and table scroll, and keeps
   focus on the lead tag you were using, so picking Deal doesn't jump the view. */
function render(){
  var sy=window.scrollY,
      sx=[].map.call(document.querySelectorAll(".scroll"),function(s){return s.scrollLeft;}),
      ae=document.activeElement, lid=(ae&&ae.dataset&&ae.dataset.lq)?ae.dataset.lid:null;
  renderNow();
  [].forEach.call(document.querySelectorAll(".scroll"),function(s,i){if(sx[i]!=null)s.scrollLeft=sx[i];});
  window.scrollTo(window.scrollX,sy);
  if(lid){
    var again=[].filter.call(document.querySelectorAll("select.qsel"),function(s){return s.dataset.lid===lid;})[0];
    if(again)again.focus({preventScroll:true});
  }
}

function syncPillar(fromChange){
  var p=pillarById[document.getElementById("f_pillar").value]||PILLARS[0];
  if(fromChange) editing=Object.assign(editing,readForm());
  var sel=document.getElementById("f_segment");
  var keep=p.segs.some(function(s){return s.id===editing.segment;})?editing.segment:"";
  sel.innerHTML='<option value="">— none —</option>'+p.segs.map(function(s){
    return '<option value="'+s.id+'"'+(keep===s.id?" selected":"")+'>'+esc(s.label)+'</option>';}).join("");

  var host=document.getElementById("extraHost");
  host.innerHTML=(p.extra||[]).length
    ? '<div class="fset"><span class="lbl">'+esc(p.label)+' detail</span>'+
      (p.extra||[]).map(function(k){
        var def=EXTRA[k];
        return field(def.label,'<textarea id="f_x_'+k+'" placeholder="'+esc(def.ph)+'">'+esc(editing[k]||"")+'</textarea>');
      }).join("")+'</div>' : "";
  if(canWrite===false) Array.prototype.forEach.call(host.querySelectorAll("textarea"),function(el){el.disabled=true;});

  var labels=document.querySelectorAll(".dbody > label.f");
  if(labels[0]) labels[0].querySelector(".lbl").textContent=p.item+" name";
  if(labels[1]) labels[1].querySelector(".lbl").textContent=p.about;

  ["f_spent","f_leads","f_clients"].forEach(function(id){
    var el=document.getElementById(id);
    if(el&&!el.dataset.bound){el.dataset.bound="1";el.addEventListener("input",updateCalc);}
  });
  updateCalc();
}
function updateCalc(){
  var sp=n(document.getElementById("f_spent").value),
      ld=n(document.getElementById("f_leads").value),
      cl=n(document.getElementById("f_clients").value);
  document.getElementById("f_cpl").textContent = ld>0?money(sp/ld,true):"—";
  document.getElementById("f_conv").textContent = ld>0?pct1(cl/ld*100):"—";
  document.getElementById("f_cpc").textContent = cl>0?money(sp/cl,true):"—";
}
function closeDrawer(){document.getElementById("drawerHost").innerHTML="";editing=null;}
function readForm(){
  function v(id){var el=document.getElementById(id);return el?String(el.value).trim():"";}
  var body={
    pillar:v("f_pillar"),segment:v("f_segment"),name:v("f_name"),about:v("f_about"),
    ageRange:v("f_age"),gender:v("f_gender"),audience:v("f_audience"),areas:v("f_areas"),
    leadAges:v("f_leadages"),ageSpend:v("f_agespend"),
    source:v("f_source"),firstRan:v("f_firstran"),leadList:v("f_leadlist"),
    status:v("f_status"),start:v("f_start"),end:v("f_end"),
    budget:n(v("f_budget")),spent:n(v("f_spent")),
    leads:Math.round(n(v("f_leads"))),clients:Math.round(n(v("f_clients"))),
    clientNotes:v("f_clientnotes"),notes:v("f_notes"),updated:new Date().toISOString()
  };
  Object.keys(EXTRA).forEach(function(k){
    var el=document.getElementById("f_x_"+k);
    body[k]= el?String(el.value).trim() : (editing&&editing[k])||"";
  });
  return body;
}

/* ---------------- persistence ---------------- */
function localSave(){try{localStorage.setItem("mpt_rows",JSON.stringify(rows));localStorage.setItem("mpt_snaps",JSON.stringify(snaps));}catch(e){}}
function localLoad(){
  try{var s=localStorage.getItem("mpt_rows");if(s)rows=JSON.parse(s)||[];}catch(e){rows=[];}
  try{var k=localStorage.getItem("mpt_snaps");if(k)snaps=JSON.parse(k)||[];}catch(e){snaps=[];}
}
function save(){
  var body=readForm();
  if(!body.name){document.getElementById("f_name").focus();return;}
  var id=editing.id;
  var i=rows.findIndex(function(r){return r.id===id;});
  rows[i>=0?i:rows.length]=Object.assign({},body,{id:id});
  var j=dbRows.findIndex(function(r){return r.id===id;});
  dbRows[j>=0?j:dbRows.length]=Object.assign({},body,{id:id});
  if(view.tab!=="overview"&&view.tab!==body.pillar)view.tab=body.pillar;
  view.seg={};
  render(); closeDrawer();
  if(dbRef) dbRef.collection("campaigns").doc(id).set(body).catch(onWriteFail); else localSave();
}
function remove(id){
  rows=rows.filter(function(r){return r.id!==id;});
  dbRows=dbRows.filter(function(r){return r.id!==id;});
  if(liveRows)liveRows=liveRows.filter(function(r){return r.id!==id;});
  render(); closeDrawer();
  if(dbRef) dbRef.collection("campaigns").doc(id).delete().catch(onWriteFail); else localSave();
}
function onWriteFail(e){
  if(e&&e.code==="invalid_argument"){canWrite=false;render();}
  notify("That change could not be saved"+(e&&e.message?": "+e.message:".")+" Your access may be view-only.");
}

/* ---------------- events ---------------- */
document.addEventListener("click",function(e){
  if(!e.target||!e.target.closest)return;
  var t=e.target.closest("[data-metasub],[data-tab],[data-seg],[data-sort],[data-edit],[data-add],[data-delsnap],[data-pick],#snapBtn2,#addBtn,#clearF,#exportBtn,#dismissN,#snapBtn,#reportBtn");
  if(!t)return;
  if(t.dataset.metasub){view.metaSub=t.dataset.metasub;
    if(t.dataset.tab){view.tab=t.dataset.tab;view.seg={};window.scrollTo({top:0,behavior:"instant"});}
    render();return;}
  if(t.id==="dismissN"){document.getElementById("banner").dataset.sticky="0";render();return;}
  if(t.id==="snapBtn"){openSnapDialog();return;}
  if(t.dataset.delsnap){removeSnapshot(t.dataset.delsnap);return;}
  if(t.dataset.pick){view.compare=(view.compare===t.dataset.pick)?"":t.dataset.pick;render();return;}
  if(t.id==="snapBtn2"){openSnapDialog();return;}
  if(t.id==="addBtn"){ if(canWrite===false)return; openDrawer(null,null); return;}
  if(t.dataset.add!=null&&t.dataset.add!==""){ if(canWrite===false)return; openDrawer(null,t.dataset.add); return;}
  if(t.id==="clearF"){view.seg={};view.status="all";view.period="thisweek";view.q="";
    document.getElementById("statusFilter").value="all";document.getElementById("periodFilter").value="thisweek";
    document.getElementById("search").value="";render();return;}
  if(t.id==="reportBtn"){exportReport();return;}
  if(t.id==="exportBtn"){exportCsv();return;}
  if(t.dataset.leadtoggle){
    var lid=t.dataset.leadtoggle;
    view.openLeads[lid]=!view.openLeads[lid];
    render();return;
  }
  if(t.dataset.edit){openDrawer(rows.find(function(r){return r.id===t.dataset.edit;}),null);return;}
  if(t.dataset.sort){var k=t.dataset.sort;if(view.sort===k)view.dir*=-1;else{view.sort=k;view.dir=(k==="name")?1:-1;}render();return;}
  if(t.dataset.seg){
    var sk=t.dataset.sec, cur=view.seg[sk]||"all";
    view.seg[sk]=(cur===t.dataset.seg&&t.dataset.seg!=="all")?"all":t.dataset.seg;
    render();return;
  }
  if(t.dataset.tab){view.tab=t.dataset.tab;view.seg={};window.scrollTo({top:0,behavior:"instant"});render();return;}
});

/* Refresh: reload the page so the newest saved copy (offline file / Drive) or
   the newest live figures (Claude link) are shown */
document.getElementById("refreshBtn").addEventListener("click",function(){
  var b=this;
  /* On the Claude link the figures stream in live from its database, so a page
     reload would only cut that connection and blank the page. Just redraw
     with what is already there — never wipe anything. */
  if(LIVE){ liveFetch(true); return; }
  if(dbRef){
    render();
    notify("Showing the latest figures"+(DATA_AT?" — Meta last updated "+new Date(DATA_AT).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):"")+". Meta spend and leads update every 15 minutes; Sierra follow-up every hour.");
    return;
  }
  /* offline file: reloading re-reads the file, which the 15-minute update rewrites */
  b.disabled=true; b.textContent="Refreshing…";
  setTimeout(function(){ try{ location.reload(); }catch(e){ b.disabled=false; b.textContent="↻ Refresh"; } },150);
});
/* quality tag on a single lead */
document.addEventListener("change",function(e){
  var el=e.target;
  if(!el||!el.dataset||!el.dataset.lq)return;
  var r=rows.filter(function(x){return x.id===el.dataset.lq;})[0];
  if(!r)return;
  /* Records from the live database are read-only, so build fresh copies
     instead of changing them in place (an in-place change is silently ignored). */
  var lid=el.dataset.lid, hit=false;
  var recs=(Array.isArray(r.leadRecords)?r.leadRecords:[]).map(function(x){
    if((x.id||"")!==lid)return x;
    hit=true; return Object.assign({},x,{quality:el.value});
  });
  if(!hit){
    /* it came from the typed list — promote it to a real record so the tag sticks */
    var all=leadRecords(r), m=all.filter(function(x){return x.id===lid;})[0];
    if(!m)return;
    recs.push({id:m.id,name:m.name,agent:m.agent,date:m.date,quality:el.value});
  }
  r=Object.assign({},r,{leadRecords:recs});
  rows=rows.map(function(x){return x.id===r.id?r:x;});
  var dj=dbRows.findIndex(function(x){return x.id===r.id;});
  if(dj>=0)dbRows[dj]=Object.assign({},dbRows[dj],{leadRecords:recs});
  else dbRows.push({id:r.id,leadRecords:recs});
  render();
  if(dbRef)dbRef.collection("campaigns").doc(r.id).update({leadRecords:recs}).catch(onWriteFail);
  else localSave();
});

var RPT_COLORS=["#8E7035","#B59A62","#6F7A78","#95A09D","#5E6B69","#C2B089","#7E8A88"];

/* "45–54 (2), 55–64 (1)" -> {"45–54":2,"55–64":1} */
function parseLeadAges(s){
  var out={};
  if(!s)return out;
  String(s).split(/[,;]/).forEach(function(part){
    var m=part.match(/^\s*(.+?)\s*\(\s*(\d+)/);
    if(m)out[m[1].trim()]=parseInt(m[2],10);
  });
  return out;
}
function niceAxis(v){
  if(!(v>0))return {max:5,step:1};
  var step=v<=5?1:(v<=10?2:(v<=25?5:(v<=60?10:25)));
  return {max:Math.ceil(v/step)*step,step:step};
}
function dateLabel(d){
  if(!d)return "";
  var p=String(d).split("-");
  if(p.length!==3)return d;
  var M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return M[(+p[1])-1]+" "+(+p[2])+", "+p[0];
}
function periodLabel(list){
  var a=null,b=null;
  list.forEach(function(r){
    if(r.start&&(!a||r.start<a))a=r.start;
    var e=r.end||r.start;
    if(e&&(!b||e>b))b=e;
  });
  if(!a&&!b)return "All entries";
  return dateLabel(a)+" – "+dateLabel(b);
}

/* one report section per lane, so Meta and SOI are never blended */
function reportSection(label,note,list,snap){
  var t=totals(list);
  var prev=snap?prevTotals(list):null;
  var h="";
  h+='<h2 class="sectitle">'+esc(label)+'</h2>';
  if(note)h+='<div class="secnote">'+esc(note)+'</div>';
  if(!list.length){
    h+='<div class="empty">Nothing ran in this period. These figures are always kept on their own and never added to the other sections.</div>';
    return h;
  }

  /* verdict + heroes */
  var cplDir = (prev&&prev.cpl!=null&&t.cpl!=null) ? (t.cpl<prev.cpl?1:(t.cpl>prev.cpl?-1:0)) : null;
  var mark = cplDir===1?"good":(cplDir===-1?"bad":"flat");
  var glyph = cplDir===1?"▲":(cplDir===-1?"▼":"=");
  var verdict = cplDir===1?"A better week — leads got cheaper"
             : cplDir===-1?"Leads cost more than last time"
             : (t.leads>0?"Steady — "+money(t.cpl,true)+" a lead":"No leads in this period");
  h+='<div class="verdict"><div class="mark '+mark+'">'+glyph+'</div><h2>'+esc(verdict)+'</h2></div>';

  function hero(cap,val,cur,was,dir,fmt){
    var cls="",mv="",wasHtml="";
    if(was!=null&&cur!=null&&isFinite(was)&&isFinite(cur)){
      var d=cur-was;
      if(Math.abs(d)<0.005){mv='<span class="mv flat">no change</span>';}
      else{
        var good = dir>0?(d>0):(dir<0?(d<0):null);
        var arrow = d>0?"▲":"▼";
        var pct = was!==0?Math.abs(d)/Math.abs(was)*100:null;
        mv='<span class="mv '+(good===null?"flat":(good?"up":"down"))+'">'+arrow+" "+esc(fmt(Math.abs(d)))+
           (pct==null?"":" &nbsp;"+Math.round(pct)+"%")+'</span>';
        if(good===true)cls=" win"; else if(good===false)cls=" lose";
      }
      wasHtml='<span class="was">was '+esc(fmt(was))+'</span>';
    }
    return '<div class="hero'+cls+'"><span class="cap">'+esc(cap)+'</span><span class="big">'+esc(val)+'</span>'+mv+wasHtml+'</div>';
  }
  var m2=function(v){return money(v,true);}, i0=function(v){return String(Math.round(v));};
  h+='<div class="heroes">'+
    hero("Price of one lead",t.cpl==null?"—":money(t.cpl,true),t.cpl,prev?prev.cpl:null,-1,m2)+
    hero("Leads",String(t.leads),t.leads,prev?prev.leads:null,1,i0)+
    hero("Money spent",money(t.spent,true),t.spent,prev?prev.spent:null,-1,m2)+
  '</div>';

  /* where the money went */
  var spenders=list.filter(function(r){return n(r.spent)>0;})
    .slice().sort(function(a,b){return n(b.spent)-n(a.spent);});
  var prevList=[];
  if(snap&&snap.rows){
    list.forEach(function(r){
      var pr=snap.rows[r.id];
      if(pr&&n(pr.spent)>0)prevList.push({name:pr.name||r.name,spent:n(pr.spent),leads:n(pr.leads)});
    });
    prevList.sort(function(a,b){return b.spent-a.spent;});
  }
  var totNow=t.spent, totPrev=prev?prev.spent:0, scale=Math.max(totNow,totPrev,0.01);
  if(spenders.length){
    var colorOf={};
    spenders.forEach(function(r,i){colorOf[r.name]=n(r.leads)>0?RPT_COLORS[i%RPT_COLORS.length]:"#A4503A";});
    prevList.forEach(function(r,i){ if(!colorOf[r.name])colorOf[r.name]= r.leads>0?RPT_COLORS[(spenders.length+i)%RPT_COLORS.length]:"#A4503A"; });

    h+='<div class="block"><div class="blockhead"><h3>Where the money went</h3>'+
      (snap?'<div class="key"><span><i class="k-now"></i>this period</span><span><i class="k-prev"></i>last saved</span></div>':"")+
      '</div>';
    function stack(when,sub,items,total){
      var inner=items.map(function(r){
        var w=r.spent/scale*100;
        return '<span style="flex:'+r.spent.toFixed(2)+';background:'+colorOf[r.name]+'">'+
          (w>13?esc(money(r.spent,true)):"")+'</span>';
      }).join("");
      var gap=scale-total;
      if(gap>0.005)inner+='<span style="flex:'+gap.toFixed(2)+'"></span>';
      return '<div class="stackrow"><span class="when"><b>'+esc(when)+'</b>'+esc(sub)+'</span>'+
        '<span class="sbar">'+inner+'</span><span class="tot">'+money(total,true)+'</span></div>';
    }
    h+=stack(periodLabel(list),"this period",spenders,totNow);
    if(snap&&prevList.length)h+=stack(snap.label,"last saved",prevList,totPrev);
    var seen={},legend=[];
    spenders.concat(prevList).forEach(function(r){
      if(seen[r.name])return; seen[r.name]=1;
      legend.push('<span><i style="background:'+colorOf[r.name]+'"></i>'+esc(r.name)+(n(r.leads)>0?"":" — no leads")+'</span>');
    });
    h+='<div class="names">'+legend.join("")+'</div></div>';
  }

  /* what each lead cost */
  var maxCpl=0;
  list.forEach(function(r){ var c=cpl(r); if(c!=null&&c>maxCpl)maxCpl=c;
    var pr=snap?prevRow(r):null;
    if(pr&&n(pr.leads)>0){var pc=n(pr.spent)/n(pr.leads); if(pc>maxCpl)maxCpl=pc;} });
  var ax=niceAxis(maxCpl), axMax=ax.max;
  var ranked=list.slice().sort(function(a,b){
    var ca=cpl(a),cb=cpl(b);
    if(ca==null&&cb==null)return n(b.spent)-n(a.spent);
    if(ca==null)return 1; if(cb==null)return -1;
    return ca-cb;
  });
  var shown=ranked.filter(function(r){
    var pr=snap?prevRow(r):null;
    return cpl(r)!=null || n(r.spent)>0 || (pr&&n(pr.spent)>0);
  });
  if(shown.length&&axMax>0){
    h+='<div class="block"><div class="blockhead"><h3>What each lead cost</h3>'+
      '<div class="key"><span><i class="k-now"></i>this period</span>'+
      (snap?'<span><i class="k-prev"></i>last saved</span>':"")+'<span>▏ average</span></div></div>';
    var avgPos=t.cpl!=null?Math.min(100,t.cpl/axMax*100):null;
    shown.forEach(function(r){
      var c=cpl(r), pr=snap?prevRow(r):null;
      var pc=(pr&&n(pr.leads)>0)?n(pr.spent)/n(pr.leads):null;
      var st=(normStatus(r.status)==="live")?"active":"paused";
      var bar,val;
      if(c!=null){
        bar='<i class="pb" style="width:'+Math.min(100,c/axMax*100).toFixed(1)+'%"></i>';
        val='<span class="val now">'+money(c,true)+'</span>';
      } else if(n(r.spent)>0){
        bar='<i class="pb dead" style="width:100%"></i>';
        val='<span class="val dead">$0 back</span>';
      } else if(pc!=null){
        bar='<i class="pb prev" style="width:'+Math.min(100,pc/axMax*100).toFixed(1)+'%"></i>';
        val='<span class="val none">'+money(pc,true)+'</span>';
      } else if(pr&&n(pr.spent)>0){
        bar='<i class="pb dead" style="width:100%"></i>';
        val='<span class="val dead">$0 back</span>';
      } else { return; }
      if(c!=null&&pc!=null)bar+='<i class="tick" style="left:'+Math.min(100,pc/axMax*100).toFixed(1)+'%"></i>';
      if(avgPos!=null)bar+='<i class="avg" style="left:'+avgPos.toFixed(1)+'%"></i>';
      h+='<div class="pplrow"><span class="nm">'+esc(r.name||"Untitled")+'<small>'+st+
        (c==null&&pc!=null?" · last saved":"")+'</small></span><span class="plot">'+bar+'</span>'+val+'</div>';
    });
    var ticks="";
    for(var tv=0;tv<=axMax+0.001;tv+=ax.step)ticks+='<span style="left:'+(tv/axMax*100).toFixed(2)+'%">'+money(tv)+'</span>';
    h+='<div class="axis"><span></span><span class="scale">'+ticks+'</span><span></span></div>';
    if(t.cpl!=null)h+='<div class="avgnote">Average this period: '+money(t.cpl,true)+'</div>';
    var idle=list.filter(function(r){
      var pr=snap?prevRow(r):null;
      return n(r.spent)===0 && !(pr&&n(pr.spent)>0);
    });
    if(idle.length)h+='<div class="idle"><b>'+esc(idle.map(function(r){return r.name;}).join(", "))+
      '</b> spent nothing'+(snap?" in either period":"")+'.</div>';
    h+='</div>';
  }

  /* worth acting on */
  var waste=list.filter(function(r){return n(r.spent)>0&&n(r.leads)===0;});
  var best=null,worst=null;
  list.forEach(function(r){var c=cpl(r); if(c==null)return;
    if(!best||c<cpl(best))best=r; if(!worst||c>cpl(worst))worst=r;});
  var flags=[];
  waste.forEach(function(r){flags.push('<b>“'+esc(r.name)+'” spent '+money(r.spent,true)+' and brought back nothing.</b>');});
  if(snap){
    list.forEach(function(r){
      var pr=prevRow(r);
      if(!pr||n(r.spent)>0)return;
      if(n(pr.spent)>0&&n(pr.leads)===0){
        flags.push('<b>“'+esc(r.name)+'” spent '+money(pr.spent,true)+' last time for no leads</b> and is now stopped.');
      }
    });
    /* a cheaper performer that has been switched off is the easiest win to miss */
    var cheapestOff=null;
    list.forEach(function(r){
      if(n(r.spent)>0)return;
      var pr=prevRow(r); if(!pr||n(pr.leads)===0)return;
      var pc=n(pr.spent)/n(pr.leads);
      if(best&&pc<cpl(best)&&(!cheapestOff||pc<cheapestOff.c))cheapestOff={r:r,c:pc};
    });
    if(cheapestOff){
      flags.push('<b>“'+esc(cheapestOff.r.name)+'”</b> was your cheapest at '+money(cheapestOff.c,true)+
        ' a lead and is switched off, while <b>“'+esc(worst.name)+'”</b> runs at '+money(cpl(worst),true)+'.');
    }
  }
  /* the spread between the best and worst running ad matters most, so it leads */
  if(best&&worst&&best!==worst&&cpl(worst)>cpl(best)*1.4){
    flags.unshift('<b>“'+esc(worst.name)+'” costs '+money(cpl(worst),true)+' a lead — '+
      (cpl(worst)/cpl(best)).toFixed(1)+'× what “'+esc(best.name)+'” costs</b> at '+money(cpl(best),true)+'.');
  }
  if(flags.length>3)flags=flags.slice(0,3);
  if(flags.length)h+='<div class="flag"><span class="ic">!</span><span>'+flags.join(" ")+'</span></div>';

  /* who saw it */
  var withAge=list.filter(function(r){return parseAgeSpend(r.ageSpend).length;});
  if(withAge.length){
    h+='<div class="block"><div class="blockhead"><h3>Who saw '+(withAge.length===1?'“'+esc(withAge[0].name)+'”':'the ads')+'</h3>'+
      (withAge[0].areas?'<div class="key"><span>'+esc(withAge[0].areas)+'</span></div>':"")+'</div>';
    withAge.forEach(function(r){
      var parts=parseAgeSpend(r.ageSpend), sum=parts.reduce(function(a,b){return a+b.v;},0);
      var la=parseLeadAges(r.leadAges), anyLead=false;
      var bars=parts.map(function(p,i){
        var w=p.v/sum*100;
        return '<i style="flex:'+p.v+';opacity:'+(0.3+0.7*(i+1)/parts.length).toFixed(2)+'">'+(w>11?esc(money(p.v,true)):"")+'</i>';
      }).join("");
      var labs=parts.map(function(p){return '<span style="flex:'+p.v+'">'+esc(p.label)+'</span>';}).join("");
      var marks=parts.map(function(p){
        var cnt=la[p.label];
        if(cnt){anyLead=true;return '<span style="flex:'+p.v+'">'+new Array(Math.min(cnt,4)+1).join("●")+" "+cnt+(cnt===1?" lead":" leads")+'</span>';}
        return '<span class="z" style="flex:'+p.v+'">—</span>';
      }).join("");
      h+='<div class="agewrap"><div class="who"><b>'+money(sum,true)+'</b>split by the age of who saw it'+
        (r.areas?'<br>'+esc(r.areas):"")+'</div><div><div class="agebar">'+bars+'</div>'+
        '<div class="agelbl">'+labs+'</div>'+(anyLead?'<div class="leadmark">'+marks+'</div>':"")+'</div></div>';
      if(anyLead){
        var keys=Object.keys(la);
        h+='<div class="idle">Leads came from '+esc(keys.join(" and "))+'. '+
          'Nobody in the other age groups signed up.</div>';
      }
    });
    h+='</div>';
  }
  return h;
}

function buildReportHtml(forPrint){
  var p=curPillar(), b=base(), snap=activeSnap();
  var secs=[];
  if(!p){
    lanes().forEach(function(l){
      var rowsIn=b.filter(function(r){return r.pillar===l.pillar&&inGroup(r,l.group);});
      if(rowsIn.length)secs.push({label:l.label,note:(pillarById[l.pillar]||{}).blurb||"",rows:rowsIn});
    });
    if(!secs.length)secs.push({label:"All pillars",note:"",rows:[]});
  } else if(p.split){
    p.split.forEach(function(g){
      secs.push({label:g.label,note:g.note,rows:b.filter(function(r){return inGroup(r,g);})});
    });
  } else {
    secs.push({label:p.label,note:p.blurb,rows:b});
  }

  var body="";
  body+='<div class="mast"><div><h1>'+esc(p?p.label:"All marketing pillars")+'</h1></div>'+
    '<div class="meta"><b>'+esc(periodLabel(b))+'</b><br>'+
    (snap?'compared with “'+esc(snap.label)+'”<br>':"")+
    'Made '+esc(new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}))+'</div></div>';

  secs.forEach(function(s){ body+=reportSection(s.label,s.note,s.rows,snap); });

  var caveats=["Figures as entered in the tracker. Price per lead is money spent divided by leads."];
  if(snap)caveats.push("“Last saved” is the snapshot “"+snap.label+"”, taken "+
    new Date(snap.takenAt).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})+".");
  body+='<div class="foot"><span>Marketing Pillar Tracker</span><span>'+esc(caveats.join(" "))+'</span></div>';

  return '<!doctype html><html lang="en"><head><meta charset="utf-8">'+
    '<meta name="viewport" content="width=device-width,initial-scale=1">'+
    '<title>'+esc((p?p.label:"All pillars")+" — report")+'</title>'+
    '<link rel="preconnect" href="https://fonts.googleapis.com">'+
    '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'+
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Marcellus+SC&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">'+
    '<style>'+RPT_CSS+'</style></head><body><div class="sheet">'+body+'</div>'+

function exportReport(){
