<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Marketing Pillar Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Marcellus+SC&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: hairline-ruled ledger — wordmark band > serif pillar tabs > figure row > breakdown columns > open table > slide-over */
:root{
  --paper:#E9EBEA; --surface:#FAFBFA; --surface-2:#F0F2F1; --well:#E2E5E4;
  --ink:#14191A; --ink-2:#2E3839; --muted:#434D4C; --faint:#5F6968;
  --line:#D0D6D4; --hair:#DFE4E2;
  --brass:#8E7035; --brass-2:#A98B4C; --brass-wash:#EDE7DA;
  --live:#35614A; --hold:#8A6A3E; --rest:#8C9594; --plan:#8E7035;
  --bad:#A4503A; --bad-soft:#F6E7E2;
  --display:'Marcellus','Hoefler Text',Georgia,serif;
  --caps:'Marcellus SC','Marcellus',Georgia,serif;
  --a-bg:#FFFFFF; --a-alt:#F5F5F7; --a-ink:#1D1D1F; --a-sub:#6E6E73;
  --a-line:#D2D2D7; --a-blue:#0066CC;
  --a-face:-apple-system,BlinkMacSystemFont,'SF Pro Display','IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --fig:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --a-bg:#1C1C1E; --a-alt:#000000; --a-ink:#F5F5F7; --a-sub:#98989D;
  --a-line:#38383A; --a-blue:#2997FF;
  --paper:#101414; --surface:#171C1C; --surface-2:#1D2323; --well:#232929;
  --ink:#ECEEEB; --ink-2:#D2D8D5; --muted:#C3CDCB; --faint:#9CA7A5;
  --line:#2B3232; --hair:#242A2A;
  --brass:#C2A164; --brass-2:#D7BC86; --brass-wash:#241F15;
  --live:#78AC8E; --hold:#C0A06E; --rest:#7E8886; --plan:#C2A164;
  --bad:#D98466; --bad-soft:#2A1A15;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --a-bg:#1C1C1E; --a-alt:#000000; --a-ink:#F5F5F7; --a-sub:#98989D;
  --a-line:#38383A; --a-blue:#2997FF;
  --paper:#101414; --surface:#171C1C; --surface-2:#1D2323; --well:#232929;
  --ink:#ECEEEB; --ink-2:#D2D8D5; --muted:#C3CDCB; --faint:#9CA7A5;
  --line:#2B3232; --hair:#242A2A;
  --brass:#C2A164; --brass-2:#D7BC86; --brass-wash:#241F15;
  --live:#78AC8E; --hold:#C0A06E; --rest:#7E8886; --plan:#C2A164;
  --bad:#D98466; --bad-soft:#2A1A15;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;font-weight:400;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.005em}
.lbl{font-family:var(--body);font-size:12px;letter-spacing:.06em;text-transform:none;color:var(--faint);font-weight:600}
button{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--brass);outline-offset:3px;border-radius:0}
.num,.money,.cnt,.cpl{font-family:var(--fig);font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum" 1;white-space:nowrap}

/* ---- wordmark band ---- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.barTop{padding:16px 28px 13px;display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:3px;margin-right:auto;min-width:0}
.brand h1{font-family:var(--caps);font-size:17px;margin:0;letter-spacing:.06em;line-height:1.1;color:var(--ink)}
.brand .sub{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:400}

/* ---- pillar tabs ---- */
.ptabs{display:flex;gap:0;padding:0 28px;overflow-x:auto;scrollbar-width:thin}
.ptab{position:relative;border:0;background:transparent;cursor:pointer;padding:11px 20px 13px;
  display:flex;flex-direction:column;gap:3px;align-items:flex-start;white-space:nowrap;color:var(--muted);
  border-bottom:1px solid transparent;margin-bottom:-1px}
.ptab .t{font-family:var(--display);font-size:15px;letter-spacing:.03em;line-height:1.1}
.ptab .n{font-family:var(--fig);font-variant-numeric:tabular-nums;font-size:12.5px;letter-spacing:.07em;color:var(--faint);text-transform:none}
.ptab:first-child{padding-left:0}
.ptab:hover{color:var(--ink)}
.ptab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass)}
.ptab[aria-selected="true"] .n{color:var(--brass)}
.subtabs{display:flex;gap:8px;margin:0 0 22px}
.subtab{border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;padding:8px 18px;
  font-family:var(--display);font-size:14px;letter-spacing:.03em;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.subtab .n{font-family:var(--fig);font-size:12.5px;letter-spacing:.07em;text-transform:none;color:var(--faint)}
.subtab:hover{color:var(--ink)}
.subtab[aria-selected="true"]{color:var(--ink);border-color:var(--brass)}
.subtab[aria-selected="true"] .n{color:var(--brass)}

.wrap{padding-inline:28px;padding-block:34px 72px;max-width:1420px;margin:0 auto}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:26px;
  padding-bottom:16px;border-bottom:1px solid var(--line)}
.head h2{margin:0;font-size:30px;line-height:1.15;letter-spacing:-.005em;text-wrap:balance}
.head p{margin:5px 0 0;color:var(--muted);font-size:13.5px;font-weight:400;max-width:580px}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:2px;border:1px solid var(--line);
  background:transparent;cursor:pointer;font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;color:var(--ink-2)}
.btn:hover{border-color:var(--brass);color:var(--brass)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.pri:hover{background:var(--brass);border-color:var(--brass);color:#FFF}
.btn.danger{color:#A4503A;border-color:#A4503A}
.btn.sm{padding:5px 11px;font-size:12px;letter-spacing:.06em}
.btn[disabled]{opacity:.4;cursor:not-allowed}

/* ---- figure row ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:0;margin-bottom:38px;
  border-top:1px solid var(--line)}
.tile{padding:18px 24px 20px;display:flex;flex-direction:column;gap:7px;min-width:0;border-right:1px solid var(--hair)}
.tile:last-child{border-right:0}
.tile .v{font-family:var(--display);font-variant-numeric:tabular-nums lining-nums;font-size:34px;font-weight:400;
  letter-spacing:-.01em;line-height:1;color:var(--ink)}
.tile .m{font-size:13.5px;color:var(--muted);font-weight:400;line-height:1.45}
.tile.hero .v{color:var(--brass)}
.tile.hero{background:var(--brass-wash)}
@media (max-width:760px){.tiles{border-top:0}.tile{border-right:0;border-top:1px solid var(--hair)}}

/* ---- breakdown columns ---- */
.rail{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0;margin-bottom:40px;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.pcard{background:transparent;border:0;border-right:1px solid var(--hair);padding:16px 22px 18px;
  display:flex;flex-direction:column;gap:10px;min-width:0;text-align:left;cursor:pointer;position:relative}
.pcard:last-child{border-right:0}
.pcard:hover{background:var(--surface-2)}
.pcard[aria-pressed="true"]{background:var(--surface-2)}
.pcard[aria-pressed="true"]::before{content:"";position:absolute;left:0;right:0;top:-1px;height:2px;background:var(--brass)}
.pcard .top{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.pcard .nm{font-family:var(--display);font-size:14.5px;letter-spacing:.02em;color:var(--ink)}
.pcard .big{font-family:var(--display);font-variant-numeric:tabular-nums lining-nums;font-size:22px;line-height:1;letter-spacing:-.005em}
.pcard .row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted);
  letter-spacing:.07em;text-transform:none;font-weight:400}
.pcard .row b{font-family:var(--fig);font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink);letter-spacing:.02em}
.track{height:1px;background:var(--line)}
.track i{display:block;height:1px;background:var(--brass);margin-top:0}
.pcard[aria-pressed="true"] .track i,.pcard:hover .track i{height:2px;margin-top:-1px}
@media (max-width:760px){.pcard{border-right:0;border-bottom:1px solid var(--hair)}.pcard:last-child{border-bottom:0}}

/* ---- filters ---- */
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
input,select,textarea{font:inherit;font-size:13px;font-weight:400;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:2px;padding:8px 11px;width:100%}
input::placeholder,textarea::placeholder{color:var(--faint);font-weight:400}
textarea{resize:vertical;min-height:62px;line-height:1.55}
/* filter controls — bordered, quiet, with a real visible value */
.filters select{
  -webkit-appearance:none;appearance:none;background:var(--surface-2);color:var(--ink);
  border:1px solid var(--line);border-radius:2px;padding:8px 30px 8px 12px;
  font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 15px) calc(50% + 1px),calc(100% - 11px) calc(50% + 1px);
  background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.filters select:hover{border-color:var(--brass)}
.filters select:focus{border-color:var(--brass);outline:none}
.filters select.on{border-color:var(--brass);color:var(--brass);background-color:var(--brass-wash)}
.filters select option{background:var(--surface);color:var(--ink);text-transform:none;letter-spacing:normal;font-size:13px}
.filters input{background:var(--surface-2);border-color:var(--line)}
.filters input:focus{border-color:var(--brass);outline:none}
.fgroup{display:flex;align-items:center;gap:8px;margin-left:auto}
.search{max-width:260px}

/* deltas */
.dl{display:inline-flex;align-items:center;gap:3px;font-family:var(--body);font-size:12px;font-weight:600;
  letter-spacing:.08em;white-space:nowrap}
.dl.up{color:var(--live)} .dl.down{color:var(--bad)} .dl.neutral{color:var(--muted)} .dl.flat{color:var(--faint)}
.tile .dl{margin-top:3px}
td .dl{display:block;margin-top:4px}
.cmpNote{font-size:12.5px;color:var(--brass);letter-spacing:.06em;text-transform:none;font-weight:600}

/* snapshot dialog */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:18px}
.modal .card{background:var(--surface);border:1px solid var(--line);border-radius:2px;width:min(430px,100%);
  padding:24px 26px;display:flex;flex-direction:column;gap:16px}
.modal h3{margin:0;font-size:21px;font-weight:400}
.modal p{margin:0;font-size:13.5px;color:var(--muted);font-weight:400}
.modal .acts{display:flex;gap:10px;justify-content:flex-end}
.snapList{display:flex;flex-direction:column;gap:0;max-height:210px;overflow-y:auto;border-top:1px solid var(--hair)}
.snapRow{display:flex;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px solid var(--hair);font-size:13.5px}
.snapRow .nm{font-family:var(--display);font-size:13.5px;flex:1;min-width:0}
.snapRow .fig{font-family:var(--fig);font-variant-numeric:tabular-nums;color:var(--muted);font-size:13.5px}
.snapRow button{border:0;background:transparent;color:var(--bad);cursor:pointer;font-size:12px;
  letter-spacing:.06em;text-transform:none;font-weight:600}

/* ---- Sierra tab ---- */
.sxNote{color:var(--muted);font-size:13.5px;font-weight:400;margin:-22px 0 26px}
.sxAgent{margin-top:12px;border:1px solid var(--line);background:var(--surface)}
.sxAgent>summary{list-style:none;cursor:pointer;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;padding:14px 18px}
.sxAgent>summary::-webkit-details-marker{display:none}
.sxAgent>summary .nm{font-family:var(--display);font-size:16px;color:var(--ink)}
.sxAgent>summary .cv{display:inline-block;transition:transform .15s;font-size:12px;color:var(--brass)}
.sxAgent[open]>summary .cv{transform:rotate(90deg)}
.sxAgent>summary .sm{color:var(--muted);font-size:13.5px;font-weight:400}
.sxAgent .scroll{border-top:1px solid var(--hair)}
.sxBad,.name.sxBad{color:var(--bad)}
.sxAg{white-space:nowrap}
.sxOk{color:var(--live)}
.sxSub{color:var(--muted);font-size:13.5px;font-weight:400;margin-top:3px}
.sxLink{color:var(--brass);font-size:12.5px;letter-spacing:.06em;text-decoration:none;white-space:nowrap}
.sxLink:hover{text-decoration:underline}
.sxRange{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 14px}
.sxR{border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;padding:7px 13px;font-family:var(--body);font-size:12.5px;letter-spacing:.08em;text-transform:none}
.sxR:hover{color:var(--ink);border-color:var(--brass)}
.sxR.on{color:var(--brass);border-color:var(--brass);background:var(--brass-wash)}
.sxRange .dates{display:inline-flex;gap:6px;align-items:center}
.sxPeople{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.sxCard{background:var(--surface);border:1px solid var(--line);padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.sxCard .nm{font-family:var(--display);font-size:16px;color:var(--ink)}
.sxCard .big{font-family:var(--display);font-size:28px;color:var(--brass);line-height:1.1}
.sxCard .big.sxBad{color:var(--bad)}
.sxCard .bar{height:4px;background:var(--well)}
.sxCard .bar i{display:block;height:100%;background:var(--brass)}
.sxH{font-family:var(--display);font-size:19px;margin:40px 0 6px;color:var(--ink);font-weight:400}
.sxP{color:var(--muted);font-size:13px;font-weight:400;margin:0 0 16px;max-width:760px}
/* export bar on Not contacted yet */
.ncBar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:0 0 14px}
.ncBar select{-webkit-appearance:none;appearance:none;width:auto;background:var(--surface-2);color:var(--ink);
  border:1px solid var(--line);border-radius:2px;padding:7px 30px 7px 12px;
  font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 15px) calc(50% + 1px),calc(100% - 11px) calc(50% + 1px);
  background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.ncBar select:hover,.ncBar select:focus{border-color:var(--brass);outline:none}
.ncBar select.on{border-color:var(--brass);color:var(--brass);background-color:var(--brass-wash)}
.ncBar select option{background:var(--surface);color:var(--ink);text-transform:none;letter-spacing:normal;font-size:13px}
.ncBar .meta{flex:1;min-width:200px}
.ncBar .exp{font-size:12px;letter-spacing:.06em;text-transform:none;color:var(--faint);font-weight:600}

/* ---- ad creative: the artwork of every ad that is running ---- */
.adGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(208px,1fr));gap:14px;margin-bottom:34px}
.adCard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:2px;
  display:flex;flex-direction:column;overflow:hidden}
.adCard:hover{border-color:var(--brass)}
.adCard:hover .adNm{color:var(--brass)}
.adOpen{appearance:none;-webkit-appearance:none;background:transparent;border:0;cursor:pointer;
  text-align:left;padding:0;display:flex;flex-direction:column;flex:1;width:100%;min-width:0;
  font:inherit;color:inherit}
.adMeta{position:absolute;top:9px;right:9px;z-index:2;display:inline-flex;align-items:center;gap:5px;
  text-decoration:none;color:#FFF;background:rgba(14,18,18,.66);border:1px solid rgba(255,255,255,.45);
  border-radius:2px;padding:4px 9px;font-size:11.5px;font-weight:600;letter-spacing:.02em;
  opacity:.9;transition:opacity .15s,background .15s}
.adCard:hover .adMeta{opacity:1;background:var(--brass);border-color:var(--brass)}
.adMeta:focus-visible{opacity:1}
.adShot{position:relative;background:var(--well);aspect-ratio:1/1;overflow:hidden;display:block}
.adShot img,.adShot video{width:100%;height:100%;object-fit:cover;display:block;background:var(--well)}
.adShot .none{display:flex;width:100%;height:100%;align-items:center;justify-content:center;
  color:var(--faint);font-size:12.5px;letter-spacing:.06em;text-transform:none;text-align:center;padding:0 14px}
.adPlay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;
  background:rgba(14,18,18,.56);color:#FFF;display:flex;align-items:center;justify-content:center;
  font-size:15px;padding-left:3px;pointer-events:none}
.adCard:hover .adPlay{background:var(--brass)}
.adBody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:7px;flex:1}
.adNm{font-family:var(--display);font-size:14px;line-height:1.3;color:var(--ink)}
.adWho{font-size:12.5px;color:var(--muted);font-weight:400}
.adFigs{display:flex;gap:10px;justify-content:space-between;font-size:12.5px;color:var(--muted);
  letter-spacing:.07em;text-transform:none;margin-top:auto;padding-top:8px;border-top:1px solid var(--hair)}
.adFigs b{font-family:var(--fig);font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;letter-spacing:.02em}
.fmt{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--hair);border-radius:1px;padding:2px 7px;
  font-size:12px;letter-spacing:.06em;text-transform:none;color:var(--ink-2);font-weight:600;white-space:nowrap}
.fmt.video{color:var(--brass);border-color:var(--brass)}
.fmt.carousel{color:var(--live);border-color:var(--live)}
.fmt.image{color:var(--muted)}
/* the larger preview, on this page */
.adModal{position:fixed;inset:0;z-index:52;display:flex;align-items:center;justify-content:center;padding:18px}
.adModal .card{background:var(--surface);border:1px solid var(--line);border-radius:2px;width:min(940px,100%);
  max-height:92vh;overflow-y:auto;display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr)}
.adModal .shot{background:var(--well);position:relative;min-height:320px;display:flex;align-items:center;justify-content:center}
.adModal .shot img,.adModal .shot video{width:100%;height:auto;max-height:92vh;object-fit:contain;display:block}
.adModal .side{padding:24px 26px;display:flex;flex-direction:column;gap:14px;min-width:0}
.adModal h3{margin:0;font-size:22px;font-weight:400;line-height:1.2}
.adModal .copyBlock{border-top:1px solid var(--hair);padding-top:12px;display:flex;flex-direction:column;gap:9px}
.adModal .ct{font-family:var(--display);font-size:16px;color:var(--ink);line-height:1.3}
.adModal .cb{font-size:13px;color:var(--ink-2);font-weight:400;line-height:1.6;white-space:pre-wrap}
.adModal .cd{font-size:13.5px;color:var(--muted);font-weight:400}
.adModal .figs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line)}
.adModal .figs>div{padding:11px 13px;border-right:1px solid var(--hair)}
.adModal .figs>div:last-child{border-right:0}
.adModal .figs .v{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:20px;color:var(--ink);display:block;line-height:1.1;margin-top:3px}
.adModal .figs .v.brass{color:var(--brass)}
.adCards{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.adCards figure{margin:0;flex:0 0 150px;display:flex;flex-direction:column;gap:6px}
.adCards img{width:150px;height:150px;object-fit:cover;background:var(--well);border:1px solid var(--hair)}
.adCards figcaption{font-size:12.5px;color:var(--muted);font-weight:400;line-height:1.35}
.adCards figcaption b{color:var(--ink);font-weight:600;display:block}
@media (max-width:760px){.adModal .card{grid-template-columns:1fr}.adModal .shot{min-height:0;max-height:46vh}}

/* going out to Meta to watch the ad */
.adGo{position:relative;display:block;text-decoration:none;color:inherit}
.adGo .veil{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:16px;opacity:0;transition:opacity .15s;
  background:linear-gradient(to top,rgba(14,18,18,.62),transparent 55%)}
.adGo:hover .veil,.adGo:focus-visible .veil{opacity:1}
.adGo .veil span{color:#FFF;font-size:12.5px;font-weight:600;letter-spacing:.04em;
  border:1px solid rgba(255,255,255,.75);border-radius:2px;padding:6px 13px;background:rgba(14,18,18,.45)}
.adLinks{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--hair);padding-top:12px}
.adLinks a{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--brass);
  font-size:13px;font-weight:600;border:1px solid var(--line);border-radius:2px;padding:9px 13px}
.adLinks a:hover{border-color:var(--brass);background:var(--brass-wash)}
.adLinks a .sub{color:var(--muted);font-weight:400;font-size:12px;margin-left:auto;text-align:right}
.adLinks .none{font-size:12.5px;color:var(--muted);font-weight:400}

/* ---- the Meta tab, laid out the way Apple lays out a page ----
   Full-width bands instead of stacked strips, one figure carrying the page,
   rounded surfaces and no rules anywhere. Apple's own face is SF Pro, which
   cannot be fetched, so a Mac or iPhone gets the real thing and everything
   else falls back to the tracker's own IBM Plex Sans. */
.secApple,.appleSkin{
  --a-bg:#FFFFFF; --a-alt:#F5F5F7; --a-ink:#1D1D1F; --a-sub:#6E6E73;
  --a-line:#D2D2D7; --a-blue:#0066CC;
  --a-face:-apple-system,BlinkMacSystemFont,'SF Pro Display','IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  font-family:var(--a-face);color:var(--a-ink);display:flex;flex-direction:column;gap:16px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .secApple,
  :root:not([data-theme="light"]) .appleSkin{
  --a-bg:#1C1C1E; --a-alt:#000000; --a-ink:#F5F5F7; --a-sub:#98989D;
  --a-line:#38383A; --a-blue:#2997FF}}
:root[data-theme="dark"] .secApple,:root[data-theme="dark"] .appleSkin{
  --a-bg:#1C1C1E; --a-alt:#000000; --a-ink:#F5F5F7; --a-sub:#98989D;
  --a-line:#38383A; --a-blue:#2997FF}
.secApple .aSec{background:var(--a-bg);border-radius:18px;padding:56px 26px;text-align:center}
.secApple .aSec.alt{background:var(--a-alt)}
.secApple .aIn{max-width:1000px;margin:0 auto}
.secApple .aEyebrow{font-size:19px;color:var(--a-sub);font-weight:600;margin:0 0 8px}
.secApple .aBig{font-size:clamp(52px,9vw,86px);font-weight:600;letter-spacing:-.025em;line-height:1;
  margin:0;font-variant-numeric:tabular-nums lining-nums}
.secApple .aDelta{margin:12px 0 0}
.secApple .aLead{font-size:20px;color:var(--a-sub);margin:18px auto 0;max-width:40ch;line-height:1.45}
.secApple .aH{font-size:clamp(28px,4vw,44px);font-weight:600;letter-spacing:-.02em;line-height:1.1;margin:0 0 12px}
.secApple .aP{font-size:18px;color:var(--a-sub);margin:0 auto;max-width:50ch;line-height:1.47}
.secApple .aStats{display:grid;grid-template-columns:repeat(auto-fit,minmax(136px,1fr));gap:34px;margin-top:48px}
.secApple .aStats .v{font-size:40px;font-weight:600;letter-spacing:-.02em;display:block;line-height:1;
  font-variant-numeric:tabular-nums lining-nums}
.secApple .aStats .l{font-size:15px;color:var(--a-sub);margin-top:8px;display:block}
/* the pills that replace the old rails */
.secApple .aPills{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:30px}
.secApple .aPill{border:0;background:var(--a-alt);color:var(--a-ink);cursor:pointer;font:inherit;
  font-size:15px;font-weight:500;padding:9px 18px;border-radius:980px;white-space:nowrap}
.secApple .aSec.alt .aPill{background:var(--a-bg)}
.secApple .aPill:hover{opacity:.78}
.secApple .aPill[aria-pressed="true"]{background:var(--a-blue);color:#FFF}
.secApple .aPill .n{opacity:.62;font-variant-numeric:tabular-nums;margin-left:6px}
/* the ad cards, restyled for this surface */
.secApple .aCards{display:grid;grid-template-columns:repeat(auto-fit,minmax(214px,1fr));gap:20px;
  margin-top:40px;text-align:left}
.secApple .aCards .adCard{border:0;border-radius:18px;background:var(--a-bg)}
.secApple .aSec.alt .aCards .adCard{background:var(--a-bg)}
.secApple .aCards .adCard:hover{transform:translateY(-2px)}
.secApple .aCards .adCard{transition:transform .18s}
.secApple .aCards .adNm{font-family:var(--a-face);font-size:17px;font-weight:600;color:var(--a-ink)}
.secApple .aCards .adWho,.secApple .aCards .adFigs{color:var(--a-sub);font-weight:400}
.secApple .aCards .adFigs{border-top:1px solid var(--a-line);font-size:13.5px;letter-spacing:0}
.secApple .aCards .adFigs b{color:var(--a-ink)}
.secApple .aCards .fmt{border:0;background:var(--a-alt);color:var(--a-sub);border-radius:980px;
  padding:3px 10px;font-size:12px;letter-spacing:0}
.secApple .aCards .adMeta{border-radius:980px;background:rgba(0,0,0,.55);border:0;font-size:12.5px}
.secApple .aCards .adCard:hover .adMeta{background:var(--a-blue)}
/* the campaign list */
.secApple .aList{max-width:880px;margin:40px auto 0;background:var(--a-bg);border-radius:18px;
  text-align:left;overflow:hidden}
.secApple .aSec.alt .aList{background:var(--a-bg)}
.secApple .aRow{display:flex;align-items:center;gap:18px;padding:18px 24px;flex-wrap:wrap}
.secApple .aRow+.aRow,.secApple .aTot{border-top:1px solid var(--a-line)}
.secApple .aRow.off{color:var(--a-sub)}
.secApple .aMain{flex:1;min-width:168px}
.secApple .aNm{font-size:17px;font-weight:600;line-height:1.3}
.secApple .aSt{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px;
  color:var(--a-sub);margin-top:3px}
.secApple .aFigs{display:flex;gap:0;text-align:right}
.secApple .aFigs>div{padding-left:24px;min-width:78px}
.secApple .aFigs .v{font-size:17px;font-weight:600;display:block;
  font-variant-numeric:tabular-nums lining-nums}
.secApple .aFigs .v.q{color:var(--a-blue)}
.secApple .aFigs .l{font-size:12.5px;color:var(--a-sub);display:block;margin-top:1px}
.secApple .aExtra{font-size:13.5px;color:var(--a-sub);margin-top:7px;display:flex;
  flex-direction:column;gap:3px;max-width:62ch}
.secApple .aExtra b{color:var(--a-ink);font-weight:600}
.secApple .aTools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;width:100%;
  padding-top:12px;margin-top:2px}
.secApple .aTools .btn{border-radius:980px;border-color:var(--a-line);color:var(--a-blue);
  text-transform:none;letter-spacing:0;font-size:13.5px;font-weight:500;padding:6px 15px}
.secApple .aTools .btn:hover{border-color:var(--a-blue);color:var(--a-blue)}
.secApple .aTools .leadDrop>summary{border-radius:980px;border-color:var(--a-line);color:var(--a-sub);
  font-family:var(--a-face);text-transform:none;letter-spacing:0;font-size:13.5px;font-weight:500}
.secApple .aTot{display:flex;justify-content:space-between;gap:18px;padding:17px 24px;
  background:var(--a-alt);font-size:15px;flex-wrap:wrap}
.secApple .aTot b{font-variant-numeric:tabular-nums lining-nums;font-weight:600}
.secApple .aEmpty{padding:34px 10px;color:var(--a-sub);font-size:17px}
@media (max-width:620px){
  .secApple .aSec{padding:40px 18px}
  .secApple .aFigs{flex-wrap:wrap;text-align:left;gap:14px}
  .secApple .aFigs>div{padding-left:0;min-width:70px}
}

/* ---- Sierra and History wear the same surfaces ----
   These two are dense working tables — who has not been called, which week was
   which. Rebuilding them as hero bands would cost the scanning they exist for,
   so they keep their shape and take the surfaces, type and controls instead. */
.appleSkin{font-family:var(--a-face);color:var(--a-ink)}
.appleSkin .sxH,.appleSkin .secHead h3{font-family:var(--a-face);font-weight:600;
  font-size:clamp(25px,3.3vw,37px);letter-spacing:-.02em;text-align:center;color:var(--a-ink);
  margin:46px 0 10px;line-height:1.14}
.appleSkin .sxP,.appleSkin .secHead p{font-size:17.5px;color:var(--a-sub);text-align:center;
  margin:0 auto 26px;max-width:54ch;font-weight:400;line-height:1.47}
.appleSkin .secHead{border-bottom:0;flex-direction:column;align-items:center;gap:4px;margin-bottom:22px}
.appleSkin .secHead .mark,.appleSkin .srcChip,.appleSkin .chip.seg,.appleSkin .dchip,.appleSkin .geo span{
  border-radius:980px;border-color:var(--a-line);color:var(--a-sub);letter-spacing:0;
  text-transform:none;font-size:13px;padding:3px 11px}
.appleSkin .panel{background:var(--a-bg);border:0;border-radius:18px;overflow:hidden}
.appleSkin table{font-size:15px}
.appleSkin th{font-size:13.5px;color:var(--a-sub);font-weight:500;letter-spacing:0;text-transform:none;
  padding:14px 18px;border-bottom:1px solid var(--a-line)}
.appleSkin th.s:hover{color:var(--a-blue)}
.appleSkin th .ar{color:var(--a-blue)}
.appleSkin td{padding:15px 18px;border-bottom:1px solid var(--a-line);color:var(--a-ink)}
.appleSkin tbody tr:last-child td{border-bottom:0}
.appleSkin tbody tr:hover{background:var(--a-alt)}
.appleSkin tfoot td{background:var(--a-alt);border-top:1px solid var(--a-line);color:var(--a-ink);
  font-size:14.5px;letter-spacing:0;text-transform:none;font-weight:600}
.appleSkin .name{font-family:var(--a-face);font-size:16px;font-weight:600;letter-spacing:0}
.appleSkin .meta,.appleSkin .sxSub{font-size:13.5px;color:var(--a-sub);font-weight:400}
.appleSkin .lbl{font-size:13.5px;color:var(--a-sub);letter-spacing:0;text-transform:none;font-weight:500}
/* the figure rows */
.appleSkin .tiles{border:0;background:var(--a-bg);border-radius:18px;overflow:hidden;padding:26px 8px;gap:0}
.appleSkin .tile{border:0;text-align:center;padding:14px 16px;gap:5px}
.appleSkin .tile.hero{background:transparent}
.appleSkin .tile .v{font-family:var(--a-face);font-size:37px;font-weight:600;letter-spacing:-.02em;color:var(--a-ink)}
.appleSkin .tile.hero .v{color:var(--a-blue)}
.appleSkin .tile .lbl{font-size:14px;color:var(--a-sub);font-weight:400}
.appleSkin .tile .m{font-size:13.5px;color:var(--a-sub)}
/* notes and empties */
.appleSkin .rnote,.appleSkin .hnote,.appleSkin .note{border:0;border-radius:14px;background:var(--a-alt);
  padding:15px 19px;font-size:15px;color:var(--a-sub);line-height:1.5}
.appleSkin .rnote b,.appleSkin .hnote,.appleSkin .note b{color:var(--a-ink)}
.appleSkin .rnote .tag{color:var(--a-blue);letter-spacing:0;text-transform:none;font-size:13.5px;font-weight:600}
.appleSkin .empty h3{font-family:var(--a-face);font-size:24px;font-weight:600;letter-spacing:-.015em}
.appleSkin .empty p{font-size:16px;color:var(--a-sub)}
/* every control becomes a pill */
.appleSkin .btn,.appleSkin .sxR,.appleSkin .hrow .pick,.appleSkin .leadDrop>summary{
  border-radius:980px;border-color:var(--a-line);color:var(--a-blue);background:transparent;
  font-family:var(--a-face);text-transform:none;letter-spacing:0;font-size:14px;font-weight:500;padding:8px 16px}
.appleSkin .btn.sm,.appleSkin .hrow .pick,.appleSkin .leadDrop>summary{font-size:13.5px;padding:6px 14px}
.appleSkin .btn:hover,.appleSkin .sxR:hover,.appleSkin .hrow .pick:hover{border-color:var(--a-blue);color:var(--a-blue)}
.appleSkin .btn.pri{background:var(--a-blue);border-color:var(--a-blue);color:#FFF}
.appleSkin .sxR.on,.appleSkin .hrow .pick[aria-pressed="true"],.appleSkin .leadDrop[open]>summary{
  background:var(--a-blue);border-color:var(--a-blue);color:#FFF}
.appleSkin .ncBar select{border-radius:980px;border-color:var(--a-line);background-color:transparent;
  color:var(--a-ink);text-transform:none;letter-spacing:0;font-size:14px;font-weight:500;padding:8px 34px 8px 16px}
.appleSkin .ncBar select.on{border-color:var(--a-blue);color:var(--a-blue);background-color:transparent}
.appleSkin .ncBar .exp{font-size:13.5px;color:var(--a-sub);letter-spacing:0;text-transform:none}
.appleSkin .sxLink{color:var(--a-blue);font-size:14px;letter-spacing:0}
/* the per-person cards and the per-agent drawers */
.appleSkin .sxCard,.appleSkin .sxAgent{background:var(--a-bg);border:0;border-radius:18px;overflow:hidden}
.appleSkin .sxCard{padding:20px}
.appleSkin .sxCard .nm,.appleSkin .sxAgent>summary .nm{font-family:var(--a-face);font-size:17px;font-weight:600}
.appleSkin .sxCard .big{font-family:var(--a-face);font-size:33px;font-weight:600;letter-spacing:-.02em;color:var(--a-blue)}
.appleSkin .sxCard .bar,.appleSkin .hcell .mb{background:var(--a-alt);border-radius:980px;overflow:hidden}
.appleSkin .sxCard .bar i,.appleSkin .hcell .mb i{background:var(--a-blue)}
.appleSkin .sxAgent>summary{padding:16px 20px}
.appleSkin .sxAgent>summary .sm{font-size:13.5px;color:var(--a-sub)}
.appleSkin .sxAgent>summary .cv{color:var(--a-blue)}
.appleSkin .sxAgent .scroll{border-top:1px solid var(--a-line)}
/* History */
.appleSkin .hrow{border-bottom:1px solid var(--a-line);padding:16px 12px}
.appleSkin .hrow.head{border-bottom:1px solid var(--a-line)}
.appleSkin .hrow.head span{font-size:13.5px;color:var(--a-sub);letter-spacing:0;text-transform:none;font-weight:500}
.appleSkin .hrow.cur{background:var(--a-alt)}
.appleSkin .hrow .wk{font-family:var(--a-face);font-size:16px;font-weight:600}
.appleSkin .hrow .wk small{font-family:var(--a-face);font-size:13px;color:var(--a-sub);
  letter-spacing:0;text-transform:none;font-weight:400}
.appleSkin .hcell .v{font-family:var(--a-face);font-size:17px;font-weight:600}
.appleSkin .hcell .v.brass{color:var(--a-blue)}
.appleSkin .dayKey{font-size:13.5px;color:var(--a-sub)}
.appleSkin .dcol .bar{border-radius:4px 4px 0 0;background:var(--a-blue)}
.appleSkin .dcol .bar.none{background:var(--a-alt)}
.appleSkin .dax,.appleSkin .dax b{color:var(--a-sub);letter-spacing:0;text-transform:none}

/* ---- table ---- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:none;color:var(--faint);font-weight:600;
  padding:13px 18px;border-bottom:1px solid var(--line);background:transparent;white-space:nowrap}
th.s{cursor:pointer;user-select:none}
th.s:hover{color:var(--brass)}
th .ar{color:var(--brass);font-size:10px;letter-spacing:0}
td{padding:16px 18px;border-bottom:1px solid var(--hair);vertical-align:top}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
.r{text-align:right}
.name{font-family:var(--display);font-size:16px;letter-spacing:.01em;line-height:1.3;color:var(--ink)}
.about{color:var(--muted);font-size:13.5px;font-weight:400;margin-top:4px;max-width:280px;line-height:1.5}
.meta{color:var(--muted);font-size:13.5px;font-weight:400}
.wrapcell{max-width:215px;font-size:13.5px;font-weight:400;line-height:1.5}
/* demographics cell */
.demo{display:flex;flex-direction:column;gap:7px;max-width:232px;min-width:150px}
.demoChips{display:flex;gap:5px;flex-wrap:wrap}
.dchip{border:1px solid var(--hair);border-radius:1px;padding:2px 7px;font-size:12px;letter-spacing:.06em;
  text-transform:none;color:var(--ink-2);white-space:nowrap}
.agebar{display:flex;height:7px;overflow:hidden;background:var(--well);border-radius:1px}
.agebar i{display:block;min-width:2px;background:var(--brass)}
.agebar i.s0{opacity:.22}.agebar i.s1{opacity:.36}.agebar i.s2{opacity:.5}
.agebar i.s3{opacity:.66}.agebar i.s4{opacity:.82}.agebar i.s5{opacity:1}
.demoLine{font-size:13.5px;line-height:1.45;color:var(--muted);font-weight:400;display:flex;gap:6px}
.demoLine .k{font-size:12px;letter-spacing:.06em;text-transform:none;color:var(--faint);
  font-weight:600;flex:0 0 46px;padding-top:2px}
.demoLine .v{min-width:0}
.demoLine b{color:var(--ink);font-weight:600}
.demoLine.clamp .v{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.geo{display:flex;gap:5px;flex-wrap:wrap;max-width:205px}
.geo span{border:1px solid var(--hair);border-radius:1px;padding:2px 7px;font-size:12.5px;letter-spacing:.06em;
  text-transform:none;color:var(--muted)}
.money,.cnt{font-size:15.5px;font-weight:400}
.cpl{font-size:15.5px;font-weight:600;color:var(--brass)}

/* ---- labels & status ---- */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.06em;
  text-transform:none;white-space:nowrap;background:transparent;padding:0}
.chip.pill{color:var(--ink-2)}
.chip.seg{color:var(--muted);border:1px solid var(--hair);border-radius:1px;padding:2px 8px;letter-spacing:.06em}
.chip.live,.chip.paused,.chip.done,.chip.planned{position:relative;padding-left:11px}
.chip.live::before,.chip.paused::before,.chip.done::before,.chip.planned::before{
  content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:5px;height:5px;border-radius:50%}
.chip.live{color:var(--live)} .chip.live::before{background:var(--live)}
.chip.paused{color:var(--hold)} .chip.paused::before{background:var(--hold)}
.chip.done{color:var(--rest)} .chip.done::before{background:var(--rest)}
.chip.planned{color:var(--plan)} .chip.planned::before{border:1px solid var(--plan);width:5px;height:5px;background:transparent}
.acts{display:flex;gap:6px;justify-content:flex-end}
tfoot td{background:var(--well);border-top:1px solid var(--line);padding:15px 18px;
  font-size:12px;letter-spacing:.06em;text-transform:none;color:var(--muted);font-weight:600}
tfoot .money,tfoot .cnt{font-size:15.5px;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:600}
tfoot .cpl{font-size:15.5px;letter-spacing:0;text-transform:none;color:var(--brass);font-weight:600}

.dates{display:inline-flex;align-items:center;gap:7px}
.dates input{width:auto;background:var(--surface-2);border-color:var(--line);font-size:13.5px;padding:7px 9px}
.dates input:focus{border-color:var(--brass);outline:none}
.dates .to{font-size:12px;letter-spacing:.06em;text-transform:none;color:var(--faint);font-weight:600}
.rnote{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;border:1px solid var(--line);border-left:2px solid var(--brass);
  padding:11px 15px;margin:0 0 18px;font-size:13.5px;color:var(--muted);line-height:1.55}
.rnote b{color:var(--ink-2);font-weight:600}
.rnote .tag{font-size:10px;letter-spacing:.06em;text-transform:none;color:var(--brass);font-weight:600;white-space:nowrap}
.rnote .warn{color:var(--bad)}

/* ---- lead names and quality ---- */
.leadDrop{min-width:250px}
.leadDrop>summary{list-style:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  border:1px solid var(--line);border-radius:1px;padding:4px 10px;font-size:12px;letter-spacing:.06em;
  text-transform:none;font-weight:600;color:var(--ink-2);user-select:none;font-family:var(--display)}
.leadDrop>summary::-webkit-details-marker{display:none}
.leadDrop>summary:hover{border-color:var(--brass);color:var(--brass)}
.leadDrop>summary .cv{display:inline-block;transition:transform .15s;font-size:12px}
.leadDrop[open]>summary{border-color:var(--brass);color:var(--brass);background:var(--brass-wash)}
.leadDrop[open]>summary .cv{transform:rotate(90deg)}
.leadDrop>.leadPanel{margin-top:9px}
@media print{.leadDrop>.leadPanel{display:flex}}
.leadBtn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:transparent;
  border-radius:1px;padding:3px 8px;font-size:12px;letter-spacing:.06em;text-transform:none;
  font-weight:600;color:var(--muted);cursor:pointer;margin-top:6px;font-family:var(--display)}
.leadBtn:hover{border-color:var(--brass);color:var(--brass)}
.leadBtn .cv{transition:transform .15s}
.leadBtn[aria-expanded="true"] .cv{transform:rotate(90deg)}
.leadPanel{margin-top:9px;border-top:1px solid var(--hair);padding-top:9px;display:flex;
  flex-direction:column;gap:7px;min-width:280px}
.leadItem{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.leadWho{min-width:0}
.leadWho .nm{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leadWho .to{font-size:12.5px;color:var(--muted);font-weight:400}
.leadWho .to b{color:var(--ink-2);font-weight:600}
.leadWho .dt{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;letter-spacing:.04em}
select.qsel{width:auto;font-size:12px;letter-spacing:.06em;text-transform:none;font-weight:600;
  padding:3px 20px 3px 8px;border-radius:1px;-webkit-appearance:none;appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 11px) calc(50% + 1px),calc(100% - 7px) calc(50% + 1px);
  background-size:4px 4px,4px 4px;background-repeat:no-repeat}
select.qsel.q-deal{color:var(--live);border-color:var(--live);background-color:var(--good-soft)}
select.qsel.q-qual{color:var(--brass);border-color:var(--brass);background-color:var(--brass-wash)}
select.qsel.q-active{color:var(--ink-2);border-color:var(--line)}
select.qsel.q-junk{color:var(--bad);border-color:var(--bad);background-color:var(--bad-soft)}
select.qsel.q-new{color:var(--faint);border-color:var(--hair)}
.qTally{display:flex;gap:9px;flex-wrap:wrap;margin-top:8px;font-size:12px;letter-spacing:.08em;
  text-transform:none;font-weight:600}
.qTally span{white-space:nowrap}
.qTally .t-deal{color:var(--live)} .qTally .t-qual{color:var(--brass)}
.qTally .t-active{color:var(--muted)} .qTally .t-junk{color:var(--bad)} .qTally .t-new{color:var(--faint)}
.leadMissing{font-size:12px;color:var(--bad);letter-spacing:.06em;margin-top:6px;display:block}

/* ---- source + lead routing ---- */
.srcChip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--hair);border-radius:1px;
  padding:2px 7px;font-size:12px;letter-spacing:.06em;text-transform:none;color:var(--brass);
  font-weight:600;white-space:nowrap;margin-top:6px}
.ran{display:block;font-size:12.5px;color:var(--faint);margin-top:5px;font-variant-numeric:tabular-nums;
  letter-spacing:.04em}
.leadList{display:flex;flex-direction:column;gap:4px;max-width:230px}
.leadRow{display:flex;gap:6px;align-items:baseline;font-size:13.5px;line-height:1.35}
.leadRow .who{color:var(--ink);font-weight:600}
.leadRow .arr{color:var(--faint);font-size:12px}
.leadRow .to{color:var(--muted);font-weight:400}
.leadMore{font-size:12px;color:var(--faint);letter-spacing:.06em;text-transform:none;font-weight:600}
.noLeads{font-size:13.5px;color:var(--faint);font-weight:400}

/* ---- day by day ---- */
.dayScroll{overflow-x:auto;padding-bottom:4px}
.dayChart{display:flex;align-items:flex-end;gap:3px;height:150px;min-width:100%;padding-top:20px}
.dcol{flex:1 1 0;min-width:13px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
  gap:3px;position:relative;height:100%}
.dcol.satstart{border-left:1px solid var(--line);margin-left:5px;padding-left:5px}
.dcol .bar{width:100%;background:var(--brass);min-height:1px;border-radius:1px 1px 0 0}
.dcol .bar.zero{background:var(--bad);opacity:.5}
.dcol .bar.none{background:var(--surface-2)}
.dcol .ld{position:absolute;top:-19px;font-size:10.5px;font-weight:600;color:var(--live);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.dcol:hover .bar{filter:brightness(1.18)}
.dayAxis{display:flex;gap:3px;margin-top:6px;min-width:100%}
.dax{flex:1 1 0;min-width:13px;text-align:center;font-size:10px;color:var(--faint);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.dax.satstart{margin-left:5px;padding-left:5px}
.dax b{display:block;color:var(--muted);font-weight:600;font-size:10px;letter-spacing:.06em;text-transform:none}
.dayKey{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:14px;align-items:center}
.dayKey i{display:inline-block;width:11px;height:9px;margin-right:5px;vertical-align:-1px}

/* ---- history ---- */
.hrow{display:grid;grid-template-columns:1.7fr 1fr 1fr 1fr 0.8fr;gap:16px;align-items:center;
  padding:14px 6px;border-bottom:1px solid var(--hair)}
.hrow.head{border-bottom:1px solid var(--line);padding-bottom:9px}
.hrow.head span{font-size:12px;letter-spacing:.06em;text-transform:none;color:var(--faint);font-weight:600}
.hrow .wk{font-family:var(--display);font-size:14.5px;line-height:1.3}
.hrow .wk small{display:block;font-size:12px;color:var(--faint);letter-spacing:.06em;
  font-family:var(--body);text-transform:none;margin-top:3px;font-weight:600}
.hcell{display:flex;flex-direction:column;gap:6px;min-width:0}
.hcell .v{font-family:var(--fig);font-variant-numeric:tabular-nums;font-size:15.5px;font-weight:600}
.hcell .v.brass{color:var(--brass)}
.hcell .mb{height:4px;background:var(--surface-2)}
.hcell .mb i{display:block;height:4px;background:var(--brass)}
.hcell .mb i.g{background:var(--live)}
.hcell .dl{font-size:12px}
.hrow.cur{background:var(--surface-2)}
.hrow .pick{border:1px solid var(--line);background:transparent;border-radius:1px;padding:4px 10px;
  font-size:12px;letter-spacing:.06em;text-transform:none;font-weight:600;cursor:pointer;color:var(--muted);
  font-family:var(--display)}
.hrow .pick:hover{border-color:var(--brass);color:var(--brass)}
.hrow .pick[aria-pressed="true"]{border-color:var(--brass);color:var(--brass);background:var(--brass-wash)}
.hnote{display:flex;gap:10px;align-items:center;background:var(--brass-wash);color:var(--brass);
  padding:11px 15px;margin:0 0 18px;font-size:13.5px;border-left:2px solid var(--brass)}
@media (max-width:760px){.hrow{grid-template-columns:1fr 1fr;gap:10px}}

/* ---- notes / empty ---- */
.note{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--brass-wash);color:var(--brass);
  border-left:2px solid var(--brass);border-radius:0;padding:13px 18px;font-size:13px;font-weight:400;margin-bottom:22px}
.note b{font-weight:600}
.note .btn{background:transparent;border-color:currentColor;color:inherit}
.empty{padding:76px 28px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.empty h3{margin:0;font-size:24px;text-wrap:balance;font-weight:400}
.empty p{margin:0;color:var(--muted);max-width:460px;font-size:13.5px;font-weight:400}

/* ---- drawer ---- */
.scrim{position:fixed;inset:0;background:rgba(14,18,18,.52);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--surface);z-index:41;
  display:flex;flex-direction:column;border-left:1px solid var(--line)}
.dhead{display:flex;align-items:center;gap:12px;padding:20px 26px;border-bottom:1px solid var(--line);
  padding-top:calc(20px + env(safe-area-inset-top,0px))}
.dhead h2{margin:0;font-size:19px;flex:1;letter-spacing:.02em}
.dbody{padding:24px 26px 30px;overflow-y:auto;display:flex;flex-direction:column;gap:20px;flex:1}
.dfoot{display:flex;gap:10px;align-items:center;padding:16px 26px;border-top:1px solid var(--line);
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.f{display:flex;flex-direction:column;gap:7px;min-width:0}
.f .hint{font-size:12.5px;color:var(--faint);font-weight:400}
.fset{border:0;border-top:1px solid var(--line);padding:18px 0 0;display:flex;flex-direction:column;gap:16px}
.fset>.lbl{color:var(--brass)}
.calc{border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:14px 0;display:flex;
  justify-content:space-between;align-items:baseline;gap:12px}
.calc .lbl{color:var(--faint)}
.calc b{font-family:var(--display);font-variant-numeric:tabular-nums lining-nums;font-size:26px;font-weight:400;color:var(--brass)}
@media (max-width:620px){
  .grid2,.grid3{grid-template-columns:1fr}
  .search{max-width:none;flex:1}
  .barTop,.ptabs{padding-inline:18px}
  .wrap{padding-inline:18px}
  .head h2{font-size:25px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- sections (split pillars) ---- */
.sec{margin-bottom:46px}
.sec:last-child{margin-bottom:0}
.secHead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:18px;
  padding-bottom:12px;border-bottom:1px solid var(--line)}
.secHead h3{margin:0;font-size:21px;font-weight:400;letter-spacing:.01em}
.secHead .mark{font-family:var(--body);font-size:12px;letter-spacing:.06em;text-transform:none;
  color:var(--brass);border:1px solid var(--brass);border-radius:1px;padding:2px 8px;font-weight:600}
.secHead p{margin:0;color:var(--muted);font-size:13.5px;font-weight:400;flex:1;min-width:180px}
.sec .tiles{margin-bottom:28px}
.sec .rail{margin-bottom:26px}

/* ---- the chrome in the same language ----
   The masthead, the tabs, the filters and the page heading were the last
   things still speaking the old ledger dialect. Sits at the end of the
   stylesheet so it settles the cascade rather than fighting it. */
body{font-family:var(--a-face);background:var(--a-alt);color:var(--a-ink)}
.bar{background:var(--a-bg);border-bottom:1px solid var(--a-line)}
.barTop{padding:14px 28px 11px;gap:11px}
.brand h1{font-family:var(--a-face);font-size:19px;font-weight:600;letter-spacing:-.012em;color:var(--a-ink)}
.brand .sub{font-size:12.5px;letter-spacing:0;text-transform:none;color:var(--a-sub);font-weight:400}

/* every button is a pill */
.btn{border-radius:980px;border:1px solid var(--a-line);background:transparent;color:var(--a-blue);
  text-transform:none;letter-spacing:0;font-size:13.5px;font-weight:500;padding:8px 16px}
.btn:hover{border-color:var(--a-blue);color:var(--a-blue);background:transparent}
.btn.pri{background:var(--a-blue);border-color:var(--a-blue);color:#FFF}
.btn.pri:hover{background:var(--a-blue);border-color:var(--a-blue);color:#FFF;opacity:.86}
.btn.sm{font-size:13px;padding:6px 14px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.38}

/* the pillar tabs read as navigation, not as filing cards */
.ptabs{padding:0 28px;gap:2px;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.ptab{padding:10px 14px 11px;gap:2px;border-bottom:2px solid transparent;color:var(--a-sub)}
.ptab:first-child{padding-left:0}
.ptab .t{font-family:var(--a-face);font-size:15px;font-weight:500;letter-spacing:-.01em}
.ptab .n{font-size:12px;letter-spacing:0;text-transform:none;color:var(--a-sub)}
.ptab:hover{color:var(--a-ink)}
.ptab[aria-selected="true"]{color:var(--a-ink);border-bottom-color:var(--a-blue)}
.ptab[aria-selected="true"] .n{color:var(--a-blue)}

/* filters sit inline as pills instead of stacking full width */
.filters{gap:9px;margin-bottom:18px;align-items:center}
.filters select{width:auto;border-radius:980px;border-color:var(--a-line);background-color:transparent;
  color:var(--a-ink);text-transform:none;letter-spacing:0;font-size:14px;font-weight:500;
  padding:9px 34px 9px 16px}
.filters select:hover,.filters select:focus{border-color:var(--a-blue)}
.filters select.on{border-color:var(--a-blue);color:var(--a-blue);background-color:transparent}
.filters select option{background:var(--a-bg);color:var(--a-ink);font-size:14px}
.filters input{border-radius:980px;border-color:var(--a-line);background:transparent;color:var(--a-ink);
  font-size:14px;padding:9px 16px}
.filters input:focus{border-color:var(--a-blue)}
.filters .search{max-width:262px}
.fgroup{gap:9px}
.fgroup .lbl{font-size:13px;color:var(--a-sub);letter-spacing:0;text-transform:none;font-weight:400}
.dates input{border-radius:980px;border-color:var(--a-line);background:transparent;font-size:13.5px;padding:8px 14px}
.dates .to{font-size:13px;color:var(--a-sub);letter-spacing:0;text-transform:none;font-weight:400}

/* the page heading */
.head{border-bottom:0;padding-bottom:0;margin-bottom:22px;flex-direction:column;align-items:flex-start;gap:5px}
.head h2{font-family:var(--a-face);font-size:clamp(29px,3.9vw,43px);font-weight:600;letter-spacing:-.022em;line-height:1.1}
.head p{font-size:17.5px;color:var(--a-sub);font-weight:400;max-width:56ch;line-height:1.45}
.cmpNote{color:var(--a-blue);letter-spacing:0;text-transform:none;font-size:13.5px;font-weight:500}

/* Meta Only / SOI Only */
.subtabs{gap:9px;margin-bottom:20px}
.subtab{border-radius:980px;border:1px solid var(--a-line);background:transparent;padding:9px 18px;
  font-family:var(--a-face);font-size:14px;font-weight:500;flex-direction:row;align-items:baseline;gap:8px}
.subtab:hover{border-color:var(--a-blue);color:var(--a-blue)}
.subtab .n{font-size:13px;letter-spacing:0;text-transform:none;color:var(--a-sub)}
.subtab[aria-selected="true"]{background:var(--a-blue);border-color:var(--a-blue);color:#FFF}
.subtab[aria-selected="true"] .n{color:rgba(255,255,255,.78)}

/* the note that says which dates are showing */
#rangeNote .rnote{border:0;border-radius:14px;background:var(--a-bg);padding:14px 18px;
  font-size:15px;color:var(--a-sub);line-height:1.5}
#rangeNote .rnote b{color:var(--a-ink);font-weight:600}
#rangeNote .rnote .tag{color:var(--a-blue);letter-spacing:0;text-transform:none;font-size:13.5px;font-weight:600}
#banner .note{border:0;border-radius:14px;background:var(--a-bg);color:var(--a-ink);font-size:15px}

/* forms, the slide-over and the dialogs */
input,select,textarea{border-radius:11px;border-color:var(--a-line);background:var(--a-bg);color:var(--a-ink)}
.drawer{background:var(--a-bg);border-left:1px solid var(--a-line)}
.dhead,.dfoot{border-color:var(--a-line)}
.dhead h2{font-family:var(--a-face);font-size:19px;font-weight:600;letter-spacing:-.01em}
.modal .card{background:var(--a-bg);border:0;border-radius:18px}
.modal h3{font-family:var(--a-face);font-size:21px;font-weight:600;letter-spacing:-.015em}
.modal p{font-size:14.5px;color:var(--a-sub)}
.fset{border-top-color:var(--a-line)}
.fset>.lbl,.f .hint{color:var(--a-sub);letter-spacing:0;text-transform:none;font-weight:400;font-size:13.5px}
.calc{border-color:var(--a-line)}
.calc b{font-family:var(--a-face);font-size:22px;font-weight:600;color:var(--a-blue)}
.snapRow{border-color:var(--a-line);font-size:14.5px}
.snapRow .nm{font-family:var(--a-face);font-size:15px;font-weight:600}
.scrim{background:rgba(0,0,0,.42)}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
